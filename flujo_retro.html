<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caso Hermosilla — Diagrama de flujo</title>
<style>
:root {
  --bg: #0E1116;
  --bg-card: #181D24;
  --bg-card-hover: #1F252E;
  --border: #2A313C;
  --text: #ECEFF4;
  --text-muted: #8A95A5;
  --accent: #F4A261;
  --lane-h: 108px;
  --card-w: 216px;
  --thumb-h: 38px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Barra superior ─────────────────────────────────────────────── */
header {
  flex: none;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 12px 22px;
  border-bottom: 1px solid var(--border);
  background: #11151B;
}

h1 {
  font-size: 0.98rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
h1 span { color: var(--accent); }
/* El separador va aparte del subtitulo para poder esconder los dos juntos en
   celular: dentro del texto plano dejaba un "Caso Hermosilla ·" colgando. */
h1 .sep { font-style: normal; }

.progreso {
  font-variant-numeric: tabular-nums;
  font-size: 0.82rem;
  color: var(--text-muted);
  white-space: nowrap;
}
.progreso b { color: var(--text); font-size: 1.05rem; }
/* El numero grande es el del hito, el mismo que sale en la tarjeta y con el que
   se dicta. La fraccion es cuanto se lleva expuesto y va aparte, para que no se
   confundan: no coinciden, porque los hitos omitidos no ocupan posicion. */
.avance {
  margin-left: 9px;
  padding-left: 9px;
  border-left: 1px solid var(--border);
  font-size: 0.72rem;
  opacity: 0.75;
}
.avance span { font-variant-numeric: tabular-nums; }

/* Se puede pinchar y arrastrar para saltar a cualquier punto del relato. */
.barra {
  flex: 1;
  height: 10px;
  background: #222933;
  border-radius: 5px;
  min-width: 60px;
  cursor: pointer;
  position: relative;
  border: 1px solid transparent;
}
.barra:hover, .barra.tirando { border-color: var(--accent); }
.barra i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
  border-radius: 5px;
  transition: width 0.3s ease;
}
.barra.tirando i { transition: none; }
/* Tirador: aparece al pasar el mouse, para que se note que se puede arrastrar */
.barra::after {
  content: '';
  position: absolute;
  top: 50%; left: var(--pos, 0%);
  width: 13px; height: 13px;
  margin-left: -6px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid #11151B;
  transform: translateY(-50%) scale(0);
  transition: transform 0.15s ease;
}
.barra:hover::after, .barra.tirando::after { transform: translateY(-50%) scale(1); }

.controles { display: flex; gap: 8px; align-items: center; }

button {
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 8px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s ease;
  white-space: nowrap;
}
button:hover:not(:disabled) { background: var(--bg-card-hover); border-color: var(--accent); }
button:disabled { opacity: 0.35; cursor: default; }
button.primario { background: var(--accent); color: #14181E; border-color: var(--accent); }
button.primario:hover:not(:disabled) { filter: brightness(1.12); }
button.activo { border-color: var(--accent); color: var(--accent); }

/* ── Cuerpo ─────────────────────────────────────────────────────── */
.cuerpo { flex: 1; display: flex; min-height: 0; }

/* Carriles */
.lienzo {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-width: 0;
}

.etiquetas {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 168px;
  background: linear-gradient(90deg, var(--bg) 78%, transparent);
  z-index: 5;
  pointer-events: none;
  padding-top: 34px;
}

.etiqueta {
  height: var(--lane-h);
  display: flex;
  align-items: center;
  padding-left: 16px;
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  opacity: 0;
  transform: translateX(-10px);
  transition: opacity 0.55s ease, transform 0.55s ease;
}
.etiqueta.viva { opacity: 1; transform: none; }
.etiqueta i {
  width: 9px; height: 9px;
  border-radius: 50%;
  margin-right: 9px;
  flex: none;
  background: currentColor;
}

.scroll {
  position: absolute;
  inset: 0;
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: #39414E var(--bg);
}
.scroll::-webkit-scrollbar { height: 9px; width: 9px; }
.scroll::-webkit-scrollbar-thumb { background: #39414E; border-radius: 5px; }

.pista { position: relative; padding-top: 34px; }

/* Un carril no existe hasta que aparece el hito que abre su arista: arrancar
   con los 7 dibujados vacios adelanta el final y no ayuda a leer. */
.carril {
  position: absolute;
  left: 0; right: 0;
  height: var(--lane-h);
  border-bottom: 1px dashed #1C222B;
  opacity: 0;
  transition: opacity 0.55s ease;
}
.carril.abierta { opacity: 1; }
/* Franja tenue del color de la arista, para no perder el carril de vista */
.carril::before {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 0; bottom: 0;
  background: currentColor;
  opacity: 0.028;
}

svg.lineas { position: absolute; inset: 0; overflow: visible; pointer-events: none; }

/* ── Tarjeta de hito ────────────────────────────────────────────── */
.nodo {
  position: absolute;
  transform: translate(-50%, -50%);
  width: var(--card-w);
  cursor: pointer;
  z-index: 3;
}

.tarjeta {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 9px;
  overflow: hidden;
  opacity: 1;
  box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  transition: transform 0.25s cubic-bezier(.2,.9,.3,1.3),
              box-shadow 0.25s ease, opacity 0.25s ease, border-color 0.25s ease;
}

/* Franja superior: un segmento por arista. Un hecho que pertenece a dos o tres
   aristas se lee como tal sin necesidad de dibujarlo dos veces en el lienzo. */
.t-franja { display: flex; height: 4px; flex: none; }
.t-franja i { flex: 1; }

.tarjeta img {
  width: 100%;
  height: var(--thumb-h);
  object-fit: cover;
  display: block;
  border-bottom: 1px solid var(--border);
  background: #12161C;
}

.t-cab {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 7px 0;
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
}
.t-cab i {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--c); flex: none;
}
/* Numero del hito en la cronologia: es el que se usa para dictar correcciones,
   asi que tiene que estar a la vista y no depender de la posicion. */
.t-cab b {
  color: var(--text);
  background: #262E3A;
  border-radius: 4px;
  padding: 1px 4px;
  margin-right: 1px;
  font-size: 0.92em;
}

/* El tamano de letra lo fija ajustarTitulo() en JS, hito por hito, para que el
   titulo entre completo: aca no se corta ni se pone elipsis. */
.t-tit {
  padding: 3px 7px 7px;
  font-weight: 700;
  line-height: 1.25;
  color: #DDE3EC;
  overflow-wrap: break-word;
  hyphens: auto;
}

/* Todas las tarjetas pesan lo mismo. Antes los hitos "clave" iban al 90% de
   opacidad y el resto al 62%, y el diagrama se leia como si la mitad de los
   hechos estuvieran a medio apagar. La jerarquia la lleva ahora una sola cosa:
   abrir una arista. */

/* El hito que inaugura una trama: es el unico que se destaca del resto, con el
   color de la arista que abre (--a, que no siempre es la del carril donde cae)
   en el borde y en una franja mas gruesa. */
.nodo.abre .tarjeta {
  border-color: var(--a);
  box-shadow: 0 0 0 1px var(--a), 0 5px 18px rgba(0,0,0,0.5);
}
.nodo.abre .t-franja { height: 7px; }

.nodo:hover .tarjeta {
  opacity: 1;
  transform: translateY(-3px);
  border-color: var(--c);
  box-shadow: 0 6px 18px rgba(0,0,0,0.5);
}

.nodo.actual .tarjeta {
  opacity: 1;
  border-color: var(--accent);
  border-top-color: var(--c);
  box-shadow: 0 0 0 2px rgba(244,162,97,0.55), 0 8px 26px rgba(0,0,0,0.6);
  transform: scale(1.06);
}
.nodo.actual .t-tit { color: var(--text); }

/* Hasta donde iba el relato, mientras se revisa un hito anterior: marca tenue
   para no perder el punto de avance. */
.nodo.frontera .tarjeta {
  opacity: 1;
  box-shadow: 0 0 0 2px rgba(236,239,244,0.28), 0 6px 18px rgba(0,0,0,0.5);
}

/* Marca de "aqui se abre una arista nueva": va sobre la foto para no sumar
   alto a la tarjeta. Sin foto cae al flujo normal, arriba del todo. */
.t-nueva {
  display: block;
  background: rgba(20,26,34,0.82);
  color: #7CD992;
  font-size: 0.5rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 7px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tarjeta img + .t-nueva {
  position: absolute;
  top: 4px; left: 0; right: 0;
  backdrop-filter: blur(2px);
}

/* Donde la vertical de un cruce toca el otro carril. Antes era un circulo del
   tamano de un hito y se leia como un hecho duplicado; ahora es una marquita
   que no se puede confundir con una tarjeta. */
.cruce-marca {
  position: absolute;
  width: 3px; height: 13px;
  border-radius: 2px;
  transform: translate(-50%, -50%);
  z-index: 2;
  opacity: 0.8;
}

.anio-marca {
  position: absolute;
  top: 6px;
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--text-muted);
  letter-spacing: 0.12em;
  transform: translateX(-50%);
  z-index: 4;
}
.anio-linea {
  position: absolute;
  top: 26px; bottom: 0;
  width: 1px;
  background: #1C222B;
  z-index: 1;
}

/* Animacion de aparicion (solo opacidad: el transform ya centra la tarjeta) */
.nodo { animation: surge 0.4s ease; }
.cruce-marca { animation: surge-p 0.42s cubic-bezier(.2,.9,.3,1.3); }
@keyframes surge   { from { opacity: 0; } to { opacity: 1; } }
@keyframes surge-p {
  from { opacity: 0; transform: translate(-50%,-50%) scaleY(0.2); }
  to   { opacity: 0.8; }
}

/* ── Panel lateral ──────────────────────────────────────────────── */
aside {
  flex: none;
  width: 380px;
  border-left: 1px solid var(--border);
  background: #11151B;
  overflow-y: auto;
  padding: 20px 22px 28px;
  scrollbar-width: thin;
}

.p-fecha {
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 7px;
}
.p-titulo { font-size: 1.06rem; font-weight: 800; line-height: 1.32; margin-bottom: 13px; }
.p-img {
  width: 100%; height: auto; max-height: 165px; object-fit: cover;
  border-radius: 9px; border: 1px solid var(--border); margin-bottom: 13px; display: block;
}
.p-desc { font-size: 0.86rem; line-height: 1.62; color: #C8D0DC; margin-bottom: 17px; }

.p-bloque { margin-bottom: 16px; }
.p-bloque h3 {
  font-size: 0.66rem; letter-spacing: 0.17em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 8px; font-weight: 700;
}

.pill {
  display: inline-block;
  font-size: 0.66rem; font-weight: 700;
  padding: 4px 9px; border-radius: 20px;
  color: #14181E; margin: 0 4px 4px 0;
}
/* Los intervinientes son botones: al activarlos se hilan con punteada todos los
   hitos donde aparece esa persona. Es la vista por persona a pedido, en vez de
   dibujarlas todas siempre y tapar el diagrama. */
.tag {
  display: inline-block;
  font-size: 0.7rem;
  background: #1D232C; border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 3px 9px; border-radius: 5px; margin: 0 4px 4px 0;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s ease;
}
.tag:hover { border-color: var(--text-muted); color: var(--text); }
.tag.activo {
  background: var(--p, var(--accent));
  border-color: var(--p, var(--accent));
  color: #14181E;
  font-weight: 700;
}

/* Barra de personas activas, en el header */
.personas { display: flex; gap: 6px; align-items: center; }
.persona-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.72rem; font-weight: 700;
  color: #14181E;
  padding: 3px 5px 3px 9px; border-radius: 20px;
  white-space: nowrap;
}
.persona-chip button {
  all: unset;
  cursor: pointer;
  line-height: 1;
  padding: 0 3px;
  opacity: 0.65;
  font-weight: 900;
}
.persona-chip button:hover { opacity: 1; }

/* Con filtro activo solo quedan los hitos de esa persona, marcados con su color */
.nodo.resalta .tarjeta {
  opacity: 1;
  border-color: var(--p);
  box-shadow: 0 0 0 2px var(--p), 0 6px 18px rgba(0,0,0,0.55);
}

.aviso {
  border-left: 3px solid var(--accent);
  background: rgba(244,162,97,0.07);
  padding: 11px 13px;
  border-radius: 0 7px 7px 0;
  font-size: 0.8rem;
  line-height: 1.55;
  margin-bottom: 14px;
}
.aviso.abre { border-left-color: #7CD992; background: rgba(124,217,146,0.08); }
.aviso b { color: var(--text); }

.p-fuente {
  display: block;
  font-size: 0.76rem;
  color: var(--text-muted);
  text-decoration: none;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 8px 10px;
  margin-bottom: 6px;
  line-height: 1.4;
  transition: all 0.15s ease;
}
.p-fuente:hover { border-color: var(--accent); color: var(--text); }

.vacio { color: var(--text-muted); font-size: 0.87rem; line-height: 1.6; padding-top: 30px; }

.revisando {
  background: rgba(236,239,244,0.06);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 15px;
  font-size: 0.78rem;
  line-height: 1.5;
  color: var(--text-muted);
}
.revisando button { display: block; margin-top: 8px; padding: 6px 11px; font-size: 0.76rem; }

/* Pantalla completa / presentacion */
/* En pantalla completa medir() recalcula el alto de carril al recibir resize. */
body.presenta header { padding: 9px 18px; }

@media (max-width: 1100px) {
  aside { width: 320px; }
}

/* La piel se inyecta aca y no al final del bloque: es cosmetica (colores y
   tipografia) y tiene que pisar al CSS base, pero no al layout de celular que
   viene despues, que es lo unico que hace que la pagina se pueda usar con el
   dedo. Si se colara despues, en la version noventera el panel volveria a ser
   una columna de 380 px dentro de una pantalla de 360. */

/* ═══ PIEL: PORTAL 90s ════════════════════════════════════════════════ */
:root {
  --bg: #0A1214;
  --bg-card: #1A2328;
  --bg-card-hover: #222D33;
  --border: #4A5A62;
  --text: #FFFFFF;
  --text-muted: #9FB4BD;
  --accent: #FFD400;
  --gris: #C0C0C0;
  --navy: #000080;
  --teal: #008080;
  --v: Verdana, Geneva, Tahoma, sans-serif;
  --m: "Courier New", monospace;
}

body {
  font-family: var(--v);
  background:
    linear-gradient(180deg, #0D181B 0%, #060C0E 100%);
}

/* ── Barra de titulo Windows 95 ───────────────────────────────────── */
header {
  background: linear-gradient(90deg, var(--navy) 0%, #1084D0 100%);
  border-bottom: 2px solid var(--gris);
  box-shadow: inset 0 1px 0 #6BA6D6;
}
h1 { font-family: var(--v); font-size: 0.88rem; color: #FFF; text-shadow: 1px 1px 0 rgba(0,0,0,0.6); }
h1 span { color: var(--accent); }
h1::before { content: "\25A0\00A0"; }

.progreso { font-family: var(--v); font-size: 0.76rem; color: #E8F4FF; }
.progreso b {
  font-family: var(--v);
  background: var(--accent); color: #000;
  border: 1px solid #000;
  padding: 1px 7px;
}
.avance {
  border-left-color: #6BA6D6; color: #E8F4FF;
  font-size: 0.7rem; letter-spacing: 0.05em;
}

/* Botones con bisel */
button {
  font-family: var(--v);
  font-size: 0.76rem;
  font-weight: 700;
  background: var(--gris);
  color: #000;
  border: 2px outset var(--gris);
  border-radius: 0;
  text-shadow: none;
}
button:hover:not(:disabled) { background: #D4D4D4; border-color: #D4D4D4; }
button:active:not(:disabled) { border-style: inset; }
button.primario { background: var(--accent); border-color: var(--accent); color: #000; }
button.primario:hover:not(:disabled) { background: #FFE550; border-color: #FFE550; }

.barra {
  background: #0A1214;
  border: 2px inset var(--gris);
  border-radius: 0;
  height: 15px;
}
.barra i {
  border-radius: 0;
  background: repeating-linear-gradient(90deg, var(--teal) 0 7px, #0A1214 7px 9px);
}
.barra::after { border-radius: 0; background: var(--accent); border-color: #000; }

/* ── Carriles ─────────────────────────────────────────────────────── */
.carril { border-bottom: 1px dotted rgba(159,180,189,0.4); }
.carril::before { opacity: 0.05; }
.anio-linea { background: rgba(159,180,189,0.25); }
.anio-marca {
  font-family: var(--v);
  font-size: 0.68rem;
  color: #000;
  background: var(--gris);
  border: 2px outset var(--gris);
  padding: 1px 7px;
  letter-spacing: 0.05em;
}
.etiqueta {
  font-family: var(--v);
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.etiqueta i { border-radius: 0; width: 11px; height: 11px; border: 1px solid rgba(0,0,0,0.5); }

/* ── Tarjetas: ventanitas con bisel ───────────────────────────────── */
.tarjeta {
  border-radius: 0;
  border: 2px outset var(--gris);
  background: var(--bg-card);
  box-shadow: 2px 2px 0 rgba(0,0,0,0.7);
}
.t-franja { height: 4px; }
.tarjeta img { border-bottom: 1px solid #000; }

/* Franja de metadatos: barra de estado de la ventana */
.t-cab {
  font-family: var(--v);
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: none;
  color: #CFE4EE;
  background: rgba(0,0,0,0.35);
  padding: 4px 7px;
  border-bottom: 1px solid rgba(0,0,0,0.5);
}
.t-cab i { border-radius: 0; width: 7px; height: 7px; }
.t-cab b {
  font-family: var(--v);
  background: var(--accent); color: #000;
  border: 1px solid #000; border-radius: 0;
  padding: 0 4px;
}
.t-tit {
  font-family: var(--v);
  font-weight: 700;
  color: #FFFFFF;
  line-height: 1.32;
  padding-top: 5px;
}
.t-tit { color: #D6E4EA; font-weight: 700; }

.t-nueva {
  background: var(--teal); color: #FFF;
  font-family: var(--v); font-weight: 700;
  letter-spacing: 0.06em;
}

.nodo:hover .tarjeta { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 rgba(0,0,0,0.8); }
.nodo.actual .tarjeta {
  border: 2px outset var(--accent);
  box-shadow: 3px 3px 0 rgba(255,212,0,0.55), 0 0 20px rgba(255,212,0,0.25);
}
.nodo.frontera .tarjeta { box-shadow: 2px 2px 0 rgba(255,255,255,0.65); }
.nodo.resalta .tarjeta { border-color: var(--p); box-shadow: 3px 3px 0 var(--p); }
.cruce-marca { border-radius: 0; border-color: #000; }

/* ── Panel: ventana de propiedades ────────────────────────────────── */
aside { background: #121D21; border-left: 2px solid var(--gris); }
.p-fecha {
  font-family: var(--v); font-size: 0.68rem;
  color: #000; background: var(--gris);
  display: block; padding: 4px 8px;
  border: 2px outset var(--gris);
  letter-spacing: 0.03em;
}
.p-titulo { font-family: var(--v); font-size: 1rem; font-weight: 700; color: #FFF; }
.p-img { border: 2px inset var(--gris); border-radius: 0; }
.p-desc { font-family: var(--v); font-size: 0.8rem; line-height: 1.68; color: #DDE9EE; }
.p-bloque h3 {
  font-family: var(--v); font-size: 0.62rem;

/* ── Celular ────────────────────────────────────────────────────────
   En pantalla chica no caben header + carriles + panel al mismo tiempo, asi
   que el panel deja de ser una columna y pasa a ser una hoja que sube desde
   abajo cuando se toca un hito, y la navegacion baja a una barra fija con
   botones del tamano de un dedo. El diagrama en si no cambia: sigue siendo el
   mismo lienzo con scroll, solo con tarjetas y carriles mas apretados (eso lo
   decide medir() en JS, no el CSS). */
.barra-movil { display: none; }
.tapa { display: none; }

@media (max-width: 820px) {
  /* Los 100vh de iOS incluyen la barra de direcciones, que se retrae al hacer
     scroll: la barra de navegacion quedaba cortada abajo. 100dvh mide el alto
     que de verdad se ve. */
  body { height: 100vh; height: 100dvh; }

  header {
    flex-wrap: wrap;
    gap: 8px 12px;
    padding: 9px 12px;
  }
  /* Sin esto los hijos de un flex no bajan de su ancho de contenido: el
     contador y los botones se salian por la derecha en vez de encogerse. */
  header > * { min-width: 0; }
  h1 { font-size: 0.82rem; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  /* El subtitulo del h1 se come una linea entera y no dice nada que el titulo
     no diga ya. */
  h1 span, h1 .sep { display: none; }
  .progreso { font-size: 0.74rem; flex: 0 1 auto; overflow: hidden; }
  .controles { margin-left: auto; flex: none; }
  .barra { order: 3; flex-basis: 100%; height: 14px; }
  .personas { order: 4; flex-basis: 100%; flex-wrap: wrap; gap: 5px; }
  /* En el header solo queda el salto de version: el resto de los controles
     vive en la barra de abajo, al alcance del pulgar. */
  .controles { gap: 6px; }
  .controles #btn-reinicio,
  .controles #btn-atras,
  .controles #btn-sig,
  .controles #btn-auto,
  .controles #btn-full { display: none; }
  #btn-piel { padding: 6px 10px; font-size: 0.78rem; }

  .cuerpo { flex-direction: column; min-height: 0; }
  .lienzo { flex: 1; min-height: 0; }
  .etiquetas {
    width: 104px;
    background: linear-gradient(90deg, var(--bg) 68%, transparent);
    padding-top: 30px;
  }
  .etiqueta { padding-left: 9px; font-size: 0.62rem; }
  .etiqueta i { width: 7px; height: 7px; margin-right: 6px; }

  /* Arrastrar con el dedo por el lienzo tiene que mover el lienzo, no
     seleccionar texto ni disparar el zoom de doble toque. */
  .scroll { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .nodo { -webkit-tap-highlight-color: transparent; }

  /* Sin mouse no hay hover, pero el navegador deja el ultimo estado pegado
     despues de tocar: se apaga para que no quede una tarjeta levantada. */
  .nodo:hover .tarjeta { transform: none; box-shadow: 0 2px 8px rgba(0,0,0,0.35); }

  /* Panel: hoja inferior. Fuera del flujo, tapando el lienzo solo mientras se
     lee un hito. */
  aside {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    width: auto;
    height: 74dvh;
    max-height: 74dvh;
    border-left: none;
    border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    padding: 16px 16px 90px;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.6);
    transform: translateY(101%);
    transition: transform 0.28s cubic-bezier(.2,.8,.3,1);
    z-index: 40;
    overscroll-behavior: contain;
  }
  body.hoja aside { transform: none; }
  /* Agarradera: la raya de arriba que dice "esto se cierra tirando" */
  aside::before {
    content: '';
    position: sticky;
    top: -6px;
    display: block;
    width: 42px; height: 4px;
    margin: -6px auto 12px;
    border-radius: 3px;
    background: var(--border);
  }

  .tapa {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
    z-index: 39;
  }
  body.hoja .tapa { opacity: 1; pointer-events: auto; }

  .p-titulo { font-size: 1rem; }
  .p-img { max-height: 190px; }
  .p-desc { font-size: 0.9rem; }
  /* Los intervinientes y las fuentes son los dos sitios donde se toca: con
     44 px de alto dejan de fallar los dedos. */
  .tag { font-size: 0.8rem; padding: 8px 12px; }
  .p-fuente { padding: 11px 12px; font-size: 0.8rem; }

  /* Barra de navegacion fija */
  .barra-movil {
    display: flex;
    flex: none;
    gap: 8px;
    padding: 9px 12px;
    padding-bottom: calc(9px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    /* Variable y no color fijo: asi la barra acompana a la piel que este puesta
       en vez de quedar azul oscura sobre el verde noventero. */
    background: var(--bg-card);
    z-index: 45;
  }
  .barra-movil button {
    flex: none;
    min-width: 44px;
    min-height: 44px;
    font-size: 0.9rem;
    padding: 8px 10px;
  }
  /* "Siguiente" es el boton que se pulsa 111 veces: se queda con todo el ancho
     que sobre. Los otros dos encogen antes que desbordar. */
  .barra-movil #m-sig { flex: 1 1 0; min-width: 0; }
  .barra-movil #m-detalle { flex: 0 1 auto; min-width: 0; overflow: hidden; }
  /* Cerrar la hoja es la accion obvia mientras esta abierta, asi que el boton
     de detalle cambia de papel en vez de sumar otro boton. */
  body.hoja .barra-movil { position: relative; z-index: 45; }
}

/* Pantallas muy angostas: los rotulos de texto largo estorban mas que ayudan */
@media (max-width: 380px) {
  .etiquetas { width: 84px; }
  .etiqueta { font-size: 0.56rem; }
  .barra-movil #m-sig { font-size: 0.85rem; }
}
</style>

n el que Luis Hermosilla menciona pagos a funcionarios del SII y la CMF", "url": "https://www.ciperchile.cl/2023/11/14/aqui-estamos-haciendo-una-hueva-que-es-delito-el-audio-en-el-que-luis-hermosilla-menciona-pagos-a-funcionarios-del-sii-y-la-cmf/", "medio": "CIPER Chile, 14/11/2023"}, {"titulo": "Hermosilla-Gate: audios revelan que abogado favorito de la derecha tenía plan para sobornar a funcionarios del SII y la CMF en caso Factop", "url": "https://interferencia.cl/articulos/hermosilla-gate-audios-revelan-que-abogado-favorito-de-la-derecha-tenia-plan-para-sobornar", "medio": "Interferencia"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-factop.png", "generica": false, "imagenMedio": "CIPER Chile, 14/11/2023", "clave": false}, {"idx": 7, "n": 8, "fecha": "16 noviembre 2023", "anio": 2023, "titulo": "Fiscalía allana oficinas de Hermosilla e incauta su iPhone: nacen los 777.000 chats", "corto": "Fiscalía allana oficinas de Hermosilla e incauta su iPhone", "desc": "Dos días después de la publicación de CIPER, efectivos del OS-7 de Carabineros allanan las oficinas de Luis Hermosilla en Alonso de Córdova, Vitacura, por orden del 4° Juzgado de Garantía. Se incauta un iPhone Pro Max con toda la actividad hasta esa fecha. La extracción forense del dispositivo arroja más de 777.000 páginas de conversaciones, videos, fotografías y archivos. Este material se convierte en la fuente de todas las aristas posteriores del caso.", "aristas": ["audio-sii"], "principal": "audio-sii", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Luis Hermosilla", "Fiscalía Metropolitana Oriente", "OS-7 de Carabineros", "4° Juzgado de Garantía de Santiago"], "pers": ["4° juzgado de garantía de santiago", "fiscalía metropolitana oriente", "luis hermosilla", "os-7 de carabineros"], "fuentes": [{"titulo": "Caso coimas: allanan oficinas del abogado Luis Hermosilla e incautan celulares y computadores", "url": "https://www.elmostrador.cl/noticias/pais/2023/11/16/caso-coimas-a spina Check, 18/03/2024"}], "imagen": "https://static.emol.cl/emol50/Fotos/2024/03/19/file_20240319164700.jpg", "generica": false, "imagenMedio": "Emol, 19/03/2024", "clave": true}, {"idx": 11, "n": 12, "fecha": "abril 2024", "anio": 2024, "titulo": "Formalización de Daniel y Ariel Sauer por facturas falsas", "corto": "Formalización de Daniel y Ariel Sauer por facturas falsas", "desc": "El 4° Juzgado de Garantía de Santiago formaliza a Daniel Sauer, Ariel Sauer y a otros asociados por la emisión de 9.970 facturas falsas que causaron un perjuicio fiscal superior a $12.900 millones. Es la primera formalización en la arista Factop del caso.", "aristas": ["factop"], "principal": "factop", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Daniel Sauer", "Ariel Sauer", "4° Juzgado de Garantía de Santiago", "Ministerio Público"], "pers": ["4° juzgado de garantía de santiago", "ariel sauer", "daniel sauer", "ministerio público"], "fuentes": [{"titulo": "Hermanos Sauer pasan la noche en la cárcel: cautelares por caso Factop se decretan este martes", "url": "https://www.elmostrador.cl/noticias/pais/2024/04/08/hermanos-sauer-pasaran-la-noche-en-la-carcel-cautelares-por-caso-factop-se-decretan-este-martes/", "medio": "El Mostrador, 08/04/2024"}, {"titulo": "4° Juzgado de Garantía decreta prisión preventiva de abogados imputados", "url": "https://www.pjud.cl/prensa-y-comunicaciones/noticias-del-poder-judicial/114238", "medio": "Poder Judicial de Chile"}], "imagen": "https://media-front.elmostrador.cl/2023/11/daniel-y-ariel-sauer-hermanos-factop-facturas-sii-700x350.jpeg", "generica": false, "imagenMedio": "El Mostrador, 08/04/2024", "clave": true}, {"idx": 12, "n": 13, "fecha": "22 mayo 2024", "anio": 2024, "titulo": "CIPER: La filtración secreta desde Panamá que la Fiscalía no imputó a Muñoz", "corto": "CIPER: La filtración secreta desde Panamá que la Fiscalía…", "desc": "CIPER revela que entre el 25 y 26 de enero de 2022, el director de la PDI Sergio Muñoz filtró a Luis Hermosilla una solicitud de cooperación judicial internacional proveniente de la fiscalía anticorrupción panameña (fiscal Lizzie Bonilla) a través del mecanismo de la Red de Recuperación de Activos para América Latina (GAFILAT). La solicitud panameña investigaba a un ciudadano chileno con vínculos societarios en Panamá en una causa por lavado de activos vinculada a los Pandora Papers. La Fiscalía reconoció a CIPER no haber incluido esta filtración en la formalización de marzo 2024 porque \"no tuvieron tiempo de averiguar más detalles\", aunque señaló que probablemente se sumará a la acusación.", "aristas": ["pdi"], "principal": "pdi", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Sergio Muñoz (director general PDI)", "Luis Hermosilla", "Lizzie Marelis Bonilla (fiscal panameña)", "Fiscalía Metropolitana Oriente", "CIPER Chile"], "pers": ["ciper chile", "fiscalía metropolitana oriente", "lizzie marelis bonilla", "luis hermosilla", "sergio muñoz"], "fuentes": [{"titulo": "Solicitud secreta desde Panamá: la filtración del exjefe de la PDI a Luis Hermosilla que la fiscalía no ha imputado", "url": "https://www.ciperchile.cl/2024/05/22/solicitud-secreta-desde-panama-la-filtracion-del-exjefe-de-la-pdi-a-luis-hermosilla-que-la-fiscalia-no-ha-imputado/", "medio": "CIPER Chile, 22/05/2024"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-panama-1.jpg", "generica": false, "imagenMedio": "CIPER Chile, 22/05/2024", "clave": false}, {"idx": 13, "n": 14, "fecha": "21 agosto 2024", "anio": 2024, "titulo": "Comienza audiencia de formalización: caso Audio-Factop", "corto": "Comienza audiencia de formalización: caso Audio-Factop", "desc": "Se inicia la audiencia de formalización en la causa rol 9.081-2023 ante el 4° Juzgado de Garantía. En el primer día se formaliza a Renato Robles Iturriaga (ejecutivo de cobros de la Tesorería General de la República) y a Patricio Mejías Esparza (funcionario del SII, Dirección Regional Oriente) por cohecho. El 23 de a  preventiva contra Luis Hermosilla, Leonarda Villalobos y Luis Angulo en su calidad de autores de delitos tributarios", "url": "https://www.sii.cl/noticias/2024/230824noti02smn.htm", "medio": "SII, 23/08/2024"}, {"titulo": "Fiscalía pide prisión preventiva para Luis Hermosilla, Leonarda Villalobos y Luis Angulo en primera jornada de formalización del Caso Audios", "url": "https://www.df.cl/mercados/banca-fintech/parte-formalizacion-del-caso-audios-arriban-luis-hermosilla-y-leonarda", "medio": "Diario Financiero"}], "imagen": "https://www.df.cl/noticias/site/artic/20240821/imag/foto_0000001720240821090025/Luis-Hermosilla--Juan-Pablo-Hermosilla-_JC.jpg", "generica": false, "imagenMedio": "Diario Financiero", "clave": false}, {"idx": 15, "n": 16, "fecha": "27 agosto 2024", "anio": 2024, "titulo": "Prisión preventiva para Hermosilla y Villalobos", "corto": "Prisión preventiva para Hermosilla y Villalobos", "desc": "La magistrada Mariana Leyton Andaur decreta prisión preventiva para Luis Hermosilla y María Leonarda Villalobos, al considerar que su libertad representa un peligro para la seguridad de la sociedad. Se fija un plazo de investigación de 180 días. Luis Angulo queda con arresto domiciliario nocturno.", "aristas": ["audio-sii"], "principal": "audio-sii", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Luis Hermosilla", "María Leonarda Villalobos", "Luis Angulo", "jueza Mariana Leyton Andaur", "4° Juzgado de Garantía"], "pers": ["4° juzgado de garantía", "jueza mariana leyton andaur", "luis angulo", "luis hermosilla", "maría leonarda villalobos"], "fuentes": [{"titulo": "Jueza decreta prisión preventiva para Luis Hermosilla y Leonarda Villalobos", "url": "https://www.latercera.com/nacional/noticia/jueza-decreta-prision-preventiva-para-luis-hermosilla-y-leonarda-villalobos/IUSMVT2XGFEEXHUJ34E5GEE6F4/", "medio": "La Tercera, 27/08/2024"}, {"titulo": "Caso Audios: Tribunal dicta prisión preventiva para Luis Hermosilla y Leonarda Villalobos", "url": "http 17, "n": 18, "fecha": "2 septiembre 2024", "anio": 2024, "titulo": "CIPER: Hermosilla operó para destrabar el multimillonario negocio de Parque Capital durante el gobierno Piñera", "corto": "CIPER: Hermosilla operó para destrabar el multimillonario…", "desc": "CIPER publica la investigación que destapa cómo Luis Hermosilla —actuando como asesor del Ministerio del Interior— ejerció presiones directas sobre el seremi de Vivienda Manuel José Errázuriz y coordinó reuniones con el gabinete del ministro Felipe Ward para acelerar los IFC del proyecto Parque Capital de Grupo Patio en Lampa. La investigación detalla los mensajes entre Hermosilla y los funcionarios del Minvu, y establece que los tres terrenos habilitados fueron traspasados por $10.372.650.925. La publicación abre la arista Parque Capital como nueva línea del Caso Hermosilla e instala en la agenda pública la triangulación Chadwick–Hermosilla–Minvu.", "aristas": ["parque-capital"], "principal": "parque-capital", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Luis Hermosilla", "Álvaro Jalaff", "Antonio Jalaff", "Felipe Ward", "Manuel José Errázuriz", "Francisco Feres", "Andrés Chadwick", "CIPER Chile"], "pers": ["andrés chadwick", "antonio jalaff", "ciper chile", "felipe ward", "francisco feres", "luis hermosilla", "manuel josé errázuriz", "álvaro jalaff"], "fuentes": [{"titulo": "Hermosilla operó para destrabar multimillonario negocio de Grupo Patio en el segundo gobierno de Piñera", "url": "https://www.ciperchile.cl/2024/09/02/hermosilla-opero-para-destrabar-multimillonario-negocio-de-grupo-patio-en-el-segundo-gobierno-de-pinera/", "medio": "CIPER Chile, 02/09/2024"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-patio.png", "generica": false, "imagenMedio": "CIPER Chile, 02/09/2024", "clave": false}, {"idx": 18, "n": 19, "fecha": "5 septiembre 2024", "anio": 2024, "titulo": "CIPER: exsenador Letelier hizo lobby por Parque Capital ante el SAG", "corto": "CIPER: exsenador Letelier hizo lobby por Parque Capital…", "desc": "CIPER revela que el exsenador socialista Juan Pablo Letelier realizó dos intervenciones ante el Servicio Agrícola y Ganadero (SAG) a favor de los IFC de Parque Capital, a pedido de Francisco Feres (asesor del proyecto y amigo personal de Letelier). El primer contacto, el 21 de julio de 2023, no fue registrado en la plataforma de lobby; el segundo, el 27 de marzo de 2024, sí consta. Letelier se reunió con el director regional del SAG, Claudio Ternicier (militante DC), y con el jefe del Departamento Ambiental, Mario Ahumada. Feres describió el gesto como \"un acto extremadamente generoso\". Sin embargo, el SAG rechazó posteriormente la mayoría de las solicitudes, haciendo infructuosas las gestiones de Letelier.", "aristas": ["parque-capital"], "principal": "parque-capital", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Juan Pablo Letelier (exsenador)", "Francisco Feres (asesor Parque Capital)", "Claudio Ternicier (director regional SAG)", "Mario Ahumada (SAG)", "CIPER Chile"], "pers": ["ciper chile", "claudio ternicier", "francisco feres", "juan pablo letelier", "mario ahumada"], "fuentes": [{"titulo": "Exsenador socialista Juan Pablo Letelier hizo lobby por el mismo proyecto de Grupo Patio investigado por las gestiones de Hermosilla", "url": "https://www.ciperchile.cl/2024/09/05/exsenador-socialista-juan-pablo-letelier-hizo-lobby-por-el-mismo-proyecto-de-grupo-patio-investigado-por-las-gestiones-de-hermosilla/", "medio": "CIPER Chile, 05/09/2024"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-letelier.png", "generica": false, "imagenMedio": "CIPER Chile, 05/09/2024", "clave": false}, {"idx": 19, "n": 20, "fecha": "7 septiembre 2024", "anio": 2024, "titulo": "CIPER revela los favores entre Hermosilla y la ministra Vivanco", "corto": "CIPER revela los favores entre Hermosilla y la ministra…", "desc": "CIPER publica el reportaje con los chats entre Luis Hermosilla y la ministra de la Corte Suprema Ángela Vivanco. Las conversaciones —extraídas del teléfono incautado— muestran que la ministra le pedía a Hermosilla integrar la Sala Penal en causas específicas, que ambos coordinaron desde 2018 las gestiones ante La Moneda y senadores para que Vivanco llegara a la Suprema, y que ella le compartió información reservada sobre recursos judiciales relativos a Carabineros y FFAA. Dos días después, el 9 de septiembre, la Corte Suprema abre cuaderno de remoción contra Vivanco.", "aristas": ["bielorrusa"], "principal": "bielorrusa", "abre": ["bielorrusa"], "cruces": [], "enlaces": [{"idx": 7, "via": ["de la incautación del iPhone sale la acusación contra Vivanco"], "de": "audio-sii", "manual": true}], "intervinientes": ["Luis Hermosilla", "Ángela Vivanco (ministra Corte Suprema)", "Corte Suprema de Chile", "CIPER Chile"], "pers": ["ciper chile", "corte suprema de chile", "luis hermosilla", "ángela vivanco"], "fuentes": [{"titulo": "Chats revelan los favores entre Hermosilla y la suprema Vivanco: \"¿Alguna posibilidad de que integres la Sala Penal mañana?\"", "url": "https://www.ciperchile.cl/2024/09/07/chats-revelan-los-favores-entre-hermosilla-y-la-suprema-vivanco-alguna-posibilidad-de-que-integres-la-sala-penal-manana/", "medio": "CIPER Chile, 07/09/2024"}, {"titulo": "Favores y entrega de información: revelan chats entre Hermosilla y la ministra Vivanco", "url": "https://www.emol.com/noticias/Nacional/2024/09/08/1142137/vivanco-hermosilla-nuevos-chats-favores.html", "medio": "Emol, 08/09/2024"}, {"titulo": "\"Patéticos\" e \"ignorantes\": los chats de Hermosilla con Vivanco insultando al gobierno", "url": "https://eldesconcierto.cl/2024/09/09/pateticos-e-ignorantes-los-chats-de-luis-hermosilla-con-angela-vivanco-insultando-al-gobierno", "medio": "El Desconcierto, 09/09/2024"}, {"titulo": "Corte Suprema abre cuaderno de remoción contra ministra Vivanco por chats con Hermosilla", "url": "https://www.t13.cl/noticia/politica/corte-suprema-abre-cuaderno-remocion-contra-ministra-vivanco-chats-hermosilla-9-9-2024", "medio": "T13, 09/09/2024"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-vh.png", "generica": false, "imagenMedio": "CIPER Chile, 07/09/2024", "clave": true}, {"idx": 20, "n": 21, "fecha": "11 septiembre 2024", "anio": 2024, "titulo": "CIPER abre la arista bielorrusa: Vivanco falló a favor del consorcio Belaz-Movitec", "corto": "CIPER abre la arista bielorrusa", "desc": "CIPER publica que la ministra Ángela Vivanco redactó y firmó fallos a favor del Consorcio Belaz-Movitec (CBM, capitales chilenos y bielorrusos) en su litigio contra Codelco —el cobre desembolsó cerca de $17 mil millones— sin transparentar su relación cercana con el abogado del consorcio, Mario Vargas. La revelación abre la arista conocida como \"Muñeca Bielorrusa\", paralela al Caso Hermosilla. Días después la Corte Suprema solicita a Vivanco informe por las \"irregularidades\".", "aristas": ["bielorrusa"], "principal": "bielorrusa", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Ángela Vivanco", "Mario Vargas (abogado del consorcio)", "Consorcio Belaz-Movitec (CBM)", "Codelco", "CIPER Chile", "Corte Suprema de Chile"], "pers": ["ciper chile", "codelco", "consorcio belaz-movitec", "corte suprema de chile", "mario vargas", "ángela vivanco"], "fuentes": [{"titulo": "Ángela Vivanco falló a favor de consorcio chileno-bielorruso sin transparentar su relación cercana con abogado de esa empresa", "url": "https://www.ciperchile.cl/2024/09/11/angela-vivanco-fallo-a-favor-de-consorcio-chileno-bielorruso-sin-transparentar-su-relacion-cercana-con-abogado-de-esa-empresa/", "medio": "CIPER Chile, 11/09/2024"}, {"titulo": "Quiénes están detrás de Consorcio Belaz Movitec, la empresa favorecida por los fallos de Vivanco", "url": "https://interferencia.cl/articulos/quienes-estan-detras-de-consorcio-belaz-movitec-la-empresa-favorecida-por-los-fallos-de-la", "medio": "Interferencia"}, {"titulo": "Suprema pide a Vivanco informe por \"irregularidades\" en caso de Codelco contra consorcio chileno-bielorruso", "url": "https://www.latercera.com/nacional/noticia/suprema-pide-a-vivanco-informe-por-irregularidades-en-caso-de-codelco-contra-consorcio-chileno-bielorruso/66GEBF4LL5GB7DHV2GBN3SWFHQ/", "medio": "La Tercera"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-vv.png", "generica": false, "imagenMedio": "CIPER Chile, 11/09/2024", "clave": false}, {"idx": 21, "n": 22, "fecha": "15 septiembre 2024", "anio": 2024, "titulo": "CIPER: chats revelan que fiscal Palma coordinó con Hermosilla y Chadwick su candidatura a fiscal nacional", "corto": "CIPER: chats revelan que fiscal Palma coordinó con…", "desc": "CIPER publica que el fiscal regional de Aysén, Carlos Palma, coordinó con Luis Hermosilla una campaña sistemática para convertirse en fiscal nacional: Hermosilla gestionaba votos ante ministros de la Corte Suprema, ayudaba a nombrar jueces afines y le proporcionó el contacto directo de Andrés Chadwick. Palma se reunió con Chadwick y declaró \"Vine a hablar con Andrés\". Los chats también revelan que Palma compartió con Hermosilla audios de interceptaciones telefónicas de causas bajo su investigación, configurando presunta revelación de secreto. Hermosilla también apoyaba la candidatura del fiscal José Morales. Palma enfrenta posteriormente investigaciones penales y administrativas.", "aristas": ["audio-sii"], "principal": "audio-sii", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Carlos Palma (fiscal regional Aysén)", "Luis Hermosilla", "Andrés Chadwick", "Sebastián Piñera", "Ana Lya Uriarte (ministra Boric)", "José Morales (fiscal)", "CIPER Chile"], "pers": ["ana lya uriarte", "andrés chadwick", "carlos palma", "ciper chile", "josé morales", "luis hermosilla", "sebastián piñera"], "fuentes": [{"titulo": "Chats muestran despliegue de Hermosilla y fiscal Palma por la jefatura del Ministerio Público: \"Vine a hablar con Andrés (Chadwick)\"", "url": "https://www.ciperchile.cl/2024/09/15/chats-muestran-despliegue-de-hermosilla-y-fiscal-palma-por-la-jefatura-del-ministerio-publico-vine-a-hablar-con-andres-chadwick/", "medio": "CIPER Chile, 15/09/2024"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-palma-hermosilla.png", "generica": false, "imagenMedio": "CIPER Chile, 15/09/2024", "clave": false}, {"idx": 22, "n": 23, "fecha": "septiembre 2024", "anio": 2024, "titulo": "Corte de Apelaciones confirma prisión preventiva", "corto": "Corte de Apelaciones confirma prisión preventiva", "desc": "La Corte de Apelaciones de Santiago confirma la prisión preventiva de Luis Hermosilla y María Leonarda Villalobos, rechazando los recursos presentados por las defensas.", "aristas": ["audio-sii"], "principal": "audio-sii", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Luis Hermosilla", "María Leonarda Villalobos", "Corte de Apelaciones de Santiago"], "pers": ["corte de apelaciones de santiago", "luis hermosilla", "maría leonarda villalobos"], "fuentes": [{"titulo": "Caso Audios: Corte de Apelaciones confirma prisión preventiva para Hermosilla y Villalobos", "url": "https://www.df.cl/mercados/banca-fintech/corte-de-apelaciones-confirma-prision-preventiva-para-luis-hermosilla-y", "medio": "Diario Financiero"}], "imagen": "https://www.df.cl/noticias/site/artic/20240905/imag/foto_0000001020240905190701/Audiencia-Hermosilla-_A1.jpg", "generica": false, "imagenMedio": "Diario Financiero", "clave": true}, {"idx": 23, "n": 24, "fecha": "1 octubre 2024", "anio": 2024, "titulo": "Exministro Ward declara ante la Fiscalía detalles de su reunión con Chadwick y Hermosilla por Parque Capital", "corto": "Exministro Ward declara ante la Fiscalía detalles de su…", "desc": "Felipe Ward, exministro de Vivienda del segundo gobierno Piñera, declara ante la Fiscalía los detalles de su encuentro con Andrés Chadwick y Luis Hermosilla en junio de 2020: Chadwick lo convocó a un almuerzo aparentemente político en su oficina de Alonso de Córdova y al final lo llevó a saludar a Hermosilla en su despacho, donde se habló del proyecto Parque Capital. Ward reconoció haberle enviado a Hermosilla el 30 de junio de 2020 un mensaje preguntando si los representantes de Grupo Patio podían solicitar reunión con su jefe de gabinete y el seremi. El testimonio de Ward es clave para acreditar la triangulación Chadwick–Hermosilla–Minvu y sitúa a Chadwick como articulador de la red de influencias.", "aristas": ["parque-capital"], "principal": "parque-capital", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Felipe Ward (exministro de Vivienda)", "Andrés Chadwick", "Luis Hermosilla", "Álvaro Jalaff", "Francisco Feres", "Fiscalía Metropolitana Oriente"], "pers": ["andrés chadwick", "felipe ward", "fiscalía metropolitana oriente", "francisco feres", "luis hermosilla", "álvaro jalaff"], "fuentes": [{"titulo": "Los detalles que reveló el exministro Ward sobre su reunión con Chadwick y Hermosilla en la que hablaron del proyecto Parque Capital", "url": "https://www.ciperchile.cl/2024/10/01/los-detalles-que-revelo-el-exministro-ward-sobre-su-reunion-con-chadwick-y-hermosilla-en-la-que-hablaron-del-proyecto-parque-capital/", "medio": "CIPER Chile, 01/10/2024"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-ward.png", "generica": false, "imagenMedio": "CIPER Chile, 01/10/2024", "clave": false}, {"idx": 24, "n": 25, "fecha": "5 octubre 2024", "anio": 2024, "titulo": "CIPER: la reunión reservada en que Hermosilla entregó minutas a Ward para destrabar Parque Capital", "corto": "CIPER: la reunión reservada en que Hermosilla entregó…", "desc": "CIPER revela la existencia de una reunión reservada celebrada en agosto de 2020 en la oficina de Hermosilla, donde este entregó personalmente minutas jurídicas al ministro de Vivienda Felipe Ward para destrabar el proyecto Parque Capital. Las minutas contenían \"argumentos jurídicos\" centrados en el rol de la División de Desarrollo Urbano (DDU) como blindaje legal: \"El énfasis del tema DDU me parece importante. Es lo que puede blindar jurídicamente la decisión.\" Se estableció una estrategia de dos niveles: Ward y Hermosilla impulsarían el avance político, mientras Feres y Errázuriz resolverían los aspectos técnicos ante la Seremi.", "aristas": ["parque-capital"], "principal": "parque-capital", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Luis Hermosilla", "Felipe Ward (ministro de Vivienda)", "Manuel José Errázuriz (seremi Metropolitano Vivienda)", "Francisco Feres (asesor Parque Capital)"], "pers": ["felipe ward", "francisco feres", "luis hermosilla", "manuel josé errázuriz"], "fuentes": [{"titulo": "La reservada reunión en la que Hermosilla entregó minutas a Felipe Ward para destrabar el proyecto Parque Capital", "url": "https://www.ciperchile.cl/2024/10/05/la-reservada-reunion-en-la-que-hermosilla-entrego-minutas-a-felipe-ward-para-destrabar-el-proyecto-parque-capital/", "medio": "CIPER Chile, 05/10/2024"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-ward2.png", "generica": false, "imagenMedio": "CIPER Chile, 05/10/2024", "clave": false}, {"idx": 25, "n": 26, "fecha": "10 octubre 2024", "anio": 2024, "titulo": "Corte Suprema destituye a la ministra Ángela Vivanco", "corto": "Corte Suprema destituye a la ministra Ángela Vivanco", "desc": "El Pleno de la Corte Suprema remueve por unanimidad a la ministra Ángela Vivanco como consecuencia de los chats revelados con Luis Hermosilla que evidenciaban una relación de influencia indebida. Es el primer ministro del máximo tribunal removido en el marco del caso.", "aristas": ["bielorrusa"], "principal": "bielorrusa", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Ángela Vivanco", "Corte Suprema de Chile", "Luis Hermosilla"], "pers": ["corte suprema de chile", "luis hermosilla", "ángela vivanco"], "fuentes": [{"titulo": "Suprema dio la señal política: por unanimidad máximo tribunal destituye a Ángela Vivanco", "url": "https://www.elmostrador.cl/noticias/pais/2024/10/10/suprema-dio-la-senal-politica-por-unanimidad-maximo-tribunal-destituye-a-angela-vivanco/", "medio": "El Mostrador, 10/10/2024"}, {"titulo": "Pleno de la Corte Suprema remueve por unanimidad a ministra Ángela Vivanco", "url": "https://www.biobiochile.cl/noticias/nacional/chile/2024/10/10/pleno-de-la-corte-suprema-decide-destituir-a-ministra-angela-vivanco.shtml", "medio": "BioBioChile, 10/10/2024"}, {"titulo": "Corte Suprema remueve a ministra del máximo tribunal Ángela Vivanco Martínez", "url": "https://www.pjud.cl/prensa-y-comunicaciones/noticias-del-poder-judicial/116192", "medio": "Poder Judicial de Chile"}, {"titulo": "La crisis del Poder Judicial: el Caso Audios sigue destituyendo jueces", "url": "https://eldesconcierto.cl/2025/12/23/la-crisis-del-poder-judicial-en-chile-el-caso-audios-de-luis-hermosilla-que-golpeo-por-dentro-y-sigue-destituyendo-jueces", "medio": "El Desconcierto, 23/12/2025"}], "imagen": "https://media-front.elmostrador.cl/2024/10/A_UNO_1610327-700x467.jpg", "generica": false, "imagenMedio": "El Mostrador, 10/10/2024", "clave": true}, {"idx": 26, "n": 27, "fecha": "16 octubre 2024", "anio": 2024, "titulo": "Senado destituye al ministro de la Corte Suprema Sergio Muñoz vía acusación constitucional", "corto": "Senado destituye al ministro de la Corte Suprema Sergio…", "desc": "El Senado aprueba la acusación constitucional contra el ministro de la Corte Suprema Sergio Muñoz —diferente al director de la PDI del mismo nombre— por notable abandono de deberes. Los dos capítulos de la acusación son aprobados por estrecha mayoría (27-21 y 25-23). Muñoz es inhabilitado para ejercer cargos públicos por cinco años. Es el segundo ministro supremo destituido en menos de una semana, tras la remoción de Ángela Vivanco.", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": ["poder-judicial"], "cruces": [], "enlaces": [{"idx": 25, "via": ["la destitución de Vivanco antecede a la de Muñoz"], "de": "bielorrusa", "manual": true}], "intervin o": "Fiscalía entrega al CDE chats de funcionarios públicos…", "desc": "La Fiscalía Metropolitana Oriente hace entrega al Consejo de Defensa del Estado (CDE) de los chats detectados en el teléfono de Luis Hermosilla que involucran a funcionarios públicos. El material amplía el universo de investigados y permite al CDE evaluar acciones civiles o penales adicionales.", "aristas": ["audio-sii"], "principal": "audio-sii", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Fiscalía Metropolitana Oriente", "Consejo de Defensa del Estado (CDE)", "Luis Hermosilla"], "pers": ["consejo de defensa del estado", "fiscalía metropolitana oriente", "luis hermosilla"], "fuentes": [{"titulo": "Caso Hermosilla: Fiscalía Oriente entrega al CDE chats de funcionarios públicos detectados en el teléfono del penalista", "url": "https://www.ciperchile.cl/2024/11/29/caso-hermosilla-fiscalia-oriente-entrega-al-cde-chats-de-funcionarios-publicos-detectados-en-el-telefono-del-penalista/", "medio": "CIPER Chile, 29/11/2024"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-cde.png", "generica": false, "imagenMedio": "CIPER Chile, 29/11/2024", "clave": false}, {"idx": 32, "n": 33, "fecha": "3 diciembre 2024", "anio": 2024, "titulo": "CIPER: Chadwick declaró haber convocado la reunión con Ward y admite $235 millones en pagos de Hermosilla", "corto": "CIPER: Chadwick declaró haber convocado la reunión con…", "desc": "En su declaración ante la Fiscalía en el marco de la arista Parque Capital, Andrés Chadwick confirmó haber convocado en junio de 2020 al ministro Ward a un almuerzo y haber facilitado el contacto con Hermosilla, reconociendo que el 25 de junio envió el número de Ward a Hermosilla. Sostuvo desconocer los detalles de las gestiones posteriores ante el Minvu. Admitió además haber recibido de Hermosilla pagos totales por $235 millones —transferencias, cheques y depósitos— que explicó como asesorías a una AFP ($24,9 M), a una empresa tecnológica ($152 M) y a grupos empresariales ($6,4 M), manteniendo en reserva la identidad de sus clientes.", "aristas": ["parque-capital"], "principal": "parque-capital", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Andrés Chadwick (exministro Interior)", "Felipe Ward (exministro Vivienda)", "Luis Hermosilla", "Álvaro Jalaff", "Antonio Jalaff", "Fiscalía Metropolitana Oriente"], "pers": ["andrés chadwick", "antonio jalaff", "felipe ward", "fiscalía metropolitana oriente", "luis hermosilla", "álvaro jalaff"], "fuentes": [{"titulo": "Chadwick declaró que se reunió con Felipe Ward y que luego Hermosilla le dijo al ministro de Vivienda que tenía que conversar un tema con él", "url": "https://www.ciperchile.cl/2024/12/03/chadwick-declaro-que-se-reunio-con-felipe-ward-y-que-luego-hermosilla-le-dijo-al-ministro-de-vivienda-que-tenia-que-conversar-un-tema-con-el/", "medio": "CIPER Chile, 03/12/2024"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-pc-1.png", "generica": false, "imagenMedio": "CIPER Chile, 03/12/2024", "clave": false}, {"idx": 33, "n": 34, "fecha": "6 diciembre 2024", "anio": 2024, "titulo": "CIPER: Funcionarios de la Seremi de Vivienda revelan ante la Fiscalía las presiones para aprobar Parque Capital", "corto": "CIPER: Funcionarios de la Seremi de Vivienda revelan ante…", "desc": "Ocho funcionarios de la Seremi Metropolitana de Vivienda declaran ante la Fiscalía describiendo las presiones institucionales para aprobar los IFC de Parque Capital en agosto de 2021. Un analista de planificación recibió llamadas y mensajes mientras estaba en terreno exigiéndole aprobar un expediente el mismo día; la sección jurídica resolvió en dos días (4–6 de agosto) una consulta que normalmente demora meses; los supervisores pedían redactar resoluciones favorables pese a desacuerdos técnicos, señalando \"hay que sacarlo sí o sí ese día\". Los IFC fueron aprobados en despacho nocturno a las 20:00 del 6 de agosto, con documentos incompletos. El seremi Errázuriz notificó a Hermosill  por tráfico de influencias en arista de Parque Capital", "url": "https://www.theclinic.cl/2025/01/08/los-eventos-para-entender-la-nueva-formalizacion-a-luis-hermosilla-por-trafico-de-influencias-en-arista-parque-capital/", "medio": "The Clinic, 08/01/2025"}], "imagen": "https://media-front.elmostrador.cl/2024/08/A_UNO_1599409-700x466.jpg", "generica": false, "imagenMedio": "El Mostrador, 08/01/2025", "clave": true}, {"idx": 37, "n": 39, "fecha": "22 enero 2025", "anio": 2025, "titulo": "Corte Suprema suspende a la ministra Verónica Sabaj y abre cuaderno de remoción", "corto": "Corte Suprema suspende a la ministra Verónica Sabaj y…", "desc": "The Clinic publica las conversaciones que la ministra de la Corte de Apelaciones de Santiago, Verónica Sabaj, sostuvo con Luis Hermosilla desde 2020: los chats revelan que Sabaj colaboró activamente con el abogado en causas que involucraban al expresidente Sebastián Piñera, incluyendo el caso Dominga. La frase \"sabes que tenemos pacto forever\" sintetiza la relación. Ese mismo día, la Corte Suprema suspende a Sabaj preventivamente y abre un cuaderno de remoción.", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Verónica Sabaj (ministra Corte de Apelaciones de Santiago)", "Luis Hermosilla", "Corte Suprema de Chile", "The Clinic", "Sebastián Piñera", "caso Dominga"], "pers": ["caso dominga", "corte suprema de chile", "luis hermosilla", "sebastián piñera", "the clinic", "verónica sabaj"], "fuentes": [{"titulo": "Suprema suspende a jueza Verónica Sabaj y le abre cuaderno de remoción por chats con Hermosilla", "url": "https://www.elmostrador.cl/noticias/pais/2025/01/22/suprema-suspende-a-jueza-veronica-sabaj-y-le-abre-cuaderno-de-remocion-por-chats-con-hermosilla/", "medio": "El Mostrador, 22/01/2025"}, {"titulo": "El historial de Verónica Sabaj, la jueza bajo sumario y suspendida tras sus chats con Hermosilla", "url": "https://www.t13.cl/noticia/politica/ex cl/noticia/ex-ante/nacional/primera-sentencia-del-caso-audios-exdirector-pdi-sergio-munoz-llega-acuerdo-28-3-2025", "medio": "T13, 28/03/2025"}], "imagen": "https://media-front.elmostrador.cl/2024/03/EDITAR-IMAGENES-2-3-700x394.png", "generica": true, "imagenMedio": "", "clave": false}, {"idx": 43, "n": 45, "fecha": "31 marzo 2025", "anio": 2025, "titulo": "Corte de Apelaciones revoca el arresto domiciliario: Hermosilla vuelve a prisión", "corto": "Corte de Apelaciones revoca el arresto domiciliario", "desc": "La Corte de Apelaciones de Santiago revoca la resolución que había concedido el arresto domiciliario a Hermosilla y ordena su regreso inmediato a prisión preventiva, acogiendo el recurso de la Fiscalía.", "aristas": ["audio-sii"], "principal": "audio-sii", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Luis Hermosilla", "Corte de Apelaciones de Santiago", "Fiscalía Metropolitana Oriente"], "pers": ["corte de apelaciones de santiago", "fiscalía metropolitana oriente", "luis hermosilla"], "fuentes": [{"titulo": "Corte revoca arresto domiciliario para Luis Hermosilla y ordena su regreso a prisión preventiva", "url": "https://www.emol.com/noticias/Nacional/2025/03/31/1162185/luis-hermosilla-corte-apelaciones-cautelar.html", "medio": "Emol, 31/03/2025"}], "imagen": "https://static.emol.cl/emol50/Fotos/2025/03/31/file_20250331174435.jpg", "generica": false, "imagenMedio": "Emol, 31/03/2025", "clave": false}, {"idx": 44, "n": 46, "fecha": "19 marzo 2025", "anio": 2025, "titulo": "CIPER: Fiscalía investiga gestiones de Ulloa y Hermosilla en el nombramiento de 8 jueces y 3 fiscales judiciales", "corto": "CIPER: Fiscalía investiga gestiones de Ulloa y Hermosilla…", "desc": "CIPER revela que la Fiscalía de Alta Complejidad de O'Higgins investiga 14 gestiones coordinadas entre Luis Hermosilla y el ministro Antonio Ulloa relativas a nombramientos judiciales: cuatro postulaciones del propio Ulloa, siete designaciones ministeriales y tres concursos fiscales. Los ocho jueces cuestionados son: Alejandro Aguilar, Graciela Gómez, Rafael Corvalán, Paulina Gallardo, Gerardo Bernales, Verónica Sabaj, Mónica Olivares y María Gutiérrez. Los tres fiscales judiciales involucrados incluyen a Macarena Troncoso y Ana María Hernández. Los mecanismos identificados incluyen presión directa de Hermosilla a asesores presidenciales de Piñera (Benjamín Salas Kantor, Andrés Sotomayor, Pablo Urquízar) y solicitudes recíprocas de Sabaj hacia Hermosilla \"como favor personal\". La investigación se abrió en octubre de 2024 tras denuncia de parlamentarios PS.", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": [], "cruces": [], "enlaces": [{"idx": 29, "via": ["las gestiones salen de la lista de \"La caja de Pandora\""], "de": "audio-sii", "manual": true}], "intervinientes": ["Luis Hermosilla", "Antonio Ulloa", "Verónica Sabaj", "Paulina Gallardo", "Alejandro Aguilar", "Graciela Gómez", "Macarena Troncoso", "Benjamín Salas Kantor", "Andrés Sotomayor", "Pablo Urquízar", "Carlos Palma (fiscal suspendido)", "Fiscalía Regional O'Higgins"], "pers": ["alejandro aguilar", "andrés sotomayor", "antonio ulloa", "benjamín salas kantor", "carlos palma", "fiscalía regional o'higgins", "graciela gómez", "luis hermosilla", "macarena troncoso", "pablo urquízar", "paulina gallardo", "verónica sabaj"], "fuentes": [{"titulo": "Fiscalía investiga gestiones del ministro Ulloa y el abogado Hermosilla en el nombramiento de ocho jueces y tres fiscales judiciales", "url": "https://www.ciperchile.cl/2025/03/19/fiscalia-investiga-gestiones-del-ministro-ulloa-y-el-abogado-hermosilla-en-el-nombramiento-de-ocho-jueces-y-tres-fiscales-judiciales/", "medio": "CIPER Chile, 19/03/2025"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-ulloa-1.png", "generica": false, "imagenMedio": "CIPER Chile, 19/03/2025", "clave": false}, {"idx": 45, "n": 47, "fecha": "4 abril 2025", "anio": 2025, "titulo": "Contradicción entre Chadwick y Guerra: el exministro niega reuniones, el exfiscal admite cinco o seis encuentros", "corto": "Contradicción entre Chadwick y Guerra", "desc": "CIPER revela la profunda contradicción entre las declaraciones de Andrés Chadwick y Manuel Guerra ante el fiscal Mario Carrera. Chadwick niega categóricamente haberse reunido con Guerra fuera de un encuentro oficial de 2018: \"No tuve otras interacciones con él\". En cambio, Guerra admite entre cinco y seis encuentros con Chadwick, principalmente en almuerzos con Luis Hermosilla como intermediario, e incluso una reunión en el domicilio de Chadwick en Vitacura en el verano de 2020 donde habría estado presente el expresidente Sebastián Piñera. La Fiscalía ordena un peritaje de georreferenciación telefónica para verificar los encuentros reales entre ambos.", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Andrés Chadwick (exministro Interior)", "Manuel Guerra (exfiscal regional)", "Luis Hermosilla", "Sebastián Piñera", "Mario Carrera (fiscal regional Arica)"], "pers": ["andrés chadwick", "luis hermosilla", "manuel guerra", "mario carrera", "sebastián piñera"], "fuentes": [{"titulo": "Contradicción entre Guerra y Chadwick: exministro declaró que nunca se reunió con el exfiscal, pero este admitió cinco o seis encuentros", "url": "https://www.ciperchile.cl/2025/04/04/contradiccion-entre-guerra-y-chadwick-exministro-declaro-que-nunca-se-reunio-con-el-exfiscal-pero-este-admitio-cinco-o-seis-encuentros/", "medio": "CIPER Chile, 04/04/2025"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-fiscalia-1.png", "generica": false, "imagenMedio": "CIPER Chile, 04/04/2025", "clave": false}, {"idx": 46, "n": 48, "fecha": "7 abril 2025", "anio": 2025, "titulo": "Carlos Eugenio Lavín confirma reuniones con Chadwick y Hermosilla por el Caso Penta", "corto": "Carlos Eugenio Lavín confirma reuniones con Chadwick y…", "desc": "Carlos Eugenio Lavín, uno de los históricos dueños del Grupo Penta, declara ante la Fiscalía y confirma que sostuvo reuniones con el exministro Andrés Chadwick y el abogado Luis Hermosilla en el contexto del Caso Penta sobre financiamiento ilegal de la política. Lavín dice que Chadwick \"se metió a la oficina\", reforzando la tesis de la estructura triangular Guerra–Hermosilla–Chadwick.", "aristas": ["audio-sii"], "principal": "audio-sii", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Carlos Eugenio Lavín (Grupo Penta)", "Andrés Chadwick", "Luis Hermosilla", "Manuel Guerra", "Fiscalía"], "pers": ["andrés chadwick", "carlos eugenio lavín", "fiscalía", "luis hermosilla", "manuel guerra"], "fuentes": [{"titulo": "\"Se metió a la oficina\": Lavín confirma reuniones con Chadwick y Hermosilla por el Caso Penta", "url": "https://eldesconcierto.cl/2025/04/07/se-metio-a-la-oficina-carlos-eugenio-lavin-confirma-reuniones-con-chadwick-y-hermosilla-por-el-caso-penta", "medio": "El Desconcierto, 07/04/2025"}], "imagen": "https://media.eldesconcierto.cl/p/5f92c61ad4a54d23d370bd13436a9c61/adjuntos/378/imagenes/100/011/0100011573/1200x675/smart/se-metio-la-oficina-carlos-eugenio-lavin-confirma-reuniones-chadwick-y-hermosilla-el-caso-pentawebp.webp", "generica": false, "imagenMedio": "El Desconcierto, 07/04/2025", "clave": false}, {"idx": 47, "n": 49, "fecha": "25 abril 2025", "anio": 2025, "titulo": "Fiscalía ofrece a Héctor Mery (ministro TC) que él mismo seleccione sus mensajes con Hermosilla", "corto": "Fiscalía ofrece a Héctor Mery (ministro TC) que él mismo…", "desc": "La Fiscalía Regional de O'Higgins, que investiga la red de nombramientos judiciales, ofrece al ministro del Tribunal Constitucional Héctor Mery un trato inusual: que él mismo determine cuáles de sus mensajes con Luis Hermosilla son relevantes para la investigación, evitando así que los fiscales revisen toda su correspondencia. El fiscal señala que Mery \"fue invitado a acudir a la fiscalía a entregar él sus mensajes para no indagar en textos o mensajería\". La propuesta es rechazada por la defensa de Mery. Las comunicaciones investigadas involucran a Mery, Hermosilla y Ulloa en la coordinación de al menos 14 nombramientos de altos cargos judiciales. Mery fue exjefe de la División Judicial del Ministerio de Justicia.", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Héctor Mery (ministro Tribunal Constitucional)", "Luis Hermosilla", "Antonio Ulloa", "Aquiles Cubillos (fiscal regional O'Higgins)", "Matías Künsemüller (abogado defensor de Mery)"], "pers": ["antonio ulloa", "aquiles cubillos", "héctor mery", "luis hermosilla", "matías künsemüller"], "fuentes": [{"titulo": "Fiscalía ofreció al ministro del TC Héctor Mery que él determine los mensajes con Hermosilla que se deben extraer de su teléfono", "url": "https://www.ciperchile.cl/2025/04/25/fiscalia-ofrecio-al-ministro-del-tc-hector-mery-que-el-determine-los-mensajes-con-hermosilla-que-se-deben-extraer-de-su-telefono/", "medio": "CIPER Chile, 25/04/2025"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-mery.png", "generica": false, "imagenMedio": "CIPER Chile, 25/04/2025", "clave": false}, {"idx": 48, "n": 50, "fecha": "9 mayo 2025", "anio": 2025, "titulo": "PRIMERA SENTENCIA del caso: exdirector PDI Sergio Muñoz condenado a 3 años de libertad vigilada", "corto": "PRIMERA SENTENCIA del caso", "desc": "El exdirector general de la PDI, Sergio Muñoz, es condenado a 3 años y 1 día de libertad vigilada intensiva por revelación de secreto reiterada. Debe pagar 823 mil pesos de multa y queda inhabilitado para ejercer cargos públicos durante el cumplimiento de la pena. Es la **primera sentencia condenatoria** dictada en el marco del Caso Hermosilla, tras acuerdo de procedimiento abreviado. Muñoz declara: \"Soy un hombre honesto que cometió un error fatal que he asumido\".", "aristas": ["pdi"], "principal": "pdi", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Sergio Muñoz (e : "The Clinic, 26/05/2025", "clave": false}, {"idx": 51, "n": 53, "fecha": "6 junio 2025", "anio": 2025, "titulo": "Corte revoca prisión preventiva: Hermosilla sale de Capitán Yáber", "corto": "Corte revoca prisión preventiva", "desc": "La Octava Sala de la Corte de Apelaciones de Santiago revoca definitivamente la prisión preventiva de Luis Hermosilla y decreta arresto domiciliario total, más arraigo nacional y prohibición de comunicarse con otros imputados. Hermosilla abandona el penal Capitán Yáber. La Corte pondera los informes médicos de la defensa y el tiempo ya cumplido en reclusión.", "aristas": ["audio-sii"], "principal": "audio-sii", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Luis Hermosilla", "Corte de Apelaciones de Santiago (Octava Sala)"], "pers": ["corte de apelaciones de santiago", "luis hermosilla"], "fuentes": [{"titulo": "Corte de Apelaciones revoca prisión preventiva de Luis Hermosilla: queda con arresto domiciliario total", "url": "https://radio.uchile.cl/2025/06/06/corte-de-apelaciones-revoca-prision-preventiva-de-luis-hermosilla-queda-con-arresto-domiciliario-total/", "medio": "Radio Universidad de Chile, 06/06/2025"}, {"titulo": "Luis Hermosilla sale de Capitán Yáber: Corte decretó arresto domiciliario", "url": "https://cooperativa.cl/noticias/pais/judicial/casos-emblematicos/luis-hermosilla-sale-de-capitan-yaber-corte-decreto-arresto/2025-06-06/161608.html", "medio": "Cooperativa, 06/06/2025"}, {"titulo": "Caso Audio: Corte revoca prisión preventiva y deja en arresto domiciliario total a Luis Hermosilla", "url": "https://www.emol.com/noticias/Nacional/2025/06/06/1168558/caso-audio--corte-prisionpreventiva.html", "medio": "Emol, 06/06/2025"}], "imagen": "https://uchile-media-storage.nyc3.cdn.digitaloceanspaces.com/2025/06/Luis-Hermosilla.jpg", "generica": false, "imagenMedio": "Radio Universidad de Chile, 06/06/2025", "clave": true}, {"idx": 52, "n": 54, "fecha": "12 junio 2025", "anio": 2025, "titulo": "Corte de Apelaciones de Santiago suspende al juez Ulloa y abre cuaderno de remoción", "corto": "Corte de Apelaciones de Santiago suspende al juez Ulloa y…", "desc": "El pleno de la Corte de Apelaciones de Santiago, actuando sobre propuesta de la fiscal judicial Javiera González, aprueba cuatro meses de suspensión con medio sueldo para Antonio Ulloa y abre cuaderno de remoción. Los tres cargos son: (1) falta a la probidad por conflicto de intereses al intervenir en causas donde actuaban Hermosilla y Samuel Donoso sin abstenerse; (2) filtración de información reservada —envío a Hermosilla de actas de al menos 11 postulaciones a concursos de cargos judiciales antes de su firma oficial—; y (3) participación indebida en la recusación presentada por Donoso contra el juez Daniel Urrutia, cuya enemistad con Ulloa quedó evidenciada en chats. La Corte Suprema queda encargada de resolver la remoción definitiva.", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Antonio Ulloa (ministro Corte de Apelaciones de Santiago)", "Corte de Apelaciones de Santiago", "Javiera González (fiscal judicial)", "Luis Hermosilla", "Samuel Donoso (abogado)", "Daniel Urrutia (juez)", "Corte Suprema de Chile"], "pers": ["antonio ulloa", "corte de apelaciones de santiago", "corte suprema de chile", "daniel urrutia", "javiera gonzález", "luis hermosilla", "samuel donoso"], "fuentes": [{"titulo": "Estos son los cargos por los que la Corte ordenó la suspensión y abrir un cuaderno de remoción al juez Antonio Ulloa", "url": "https://www.ciperchile.cl/2025/06/12/estos-son-los-cargos-por-los-que-la-corte-ordeno-la-suspension-y-abrir-un-cuaderno-de-remocion-al-juez-antonio-ulloa/", "medio": "CIPER Chile, 12/06/2025"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-ulloa-2-2.png", "generica": false, "imagenMedio": "CIPER Chile, 12/06/2025", "clave": true}, {"idx": 53, "n": 55, "fecha": "17 junio 2025", "anio": 2025, "titulo": "Manuel Guerra acusa al fiscal del caso de haberle filtrado antecedentes sobre el exalcalde Torrealba", "corto": "Manuel Guerra acusa al fiscal del caso de haberle…", "desc": "Durante su declaración ante la Fiscalía Regional de Arica, el exfiscal Manuel Guerra declaró que el fiscal Felipe Sepúlveda —quien lleva la causa Hermosilla— le habría revelado antecedentes confidenciales de la investigación contra el exalcalde de Vitacura, Raúl Torrealba. Según CIPER, la filtración ocurrió el 28 de agosto de 2021: ese día Guerra escribió a Hermosilla detalles específicos (\"La Antonia Larraín... fue apretada por el nuevo director\" y \"Le encontraron 7 palos en la casa en efectivo\") que la prensa solo conocería tres días después. La declaración agrega presión sobre el equipo fiscal e introduce la defensa de Guerra basada en la \"responsabilidad compartida\".", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Manuel Guerra (exfiscal regional Oriente)", "Felipe Sepúlveda (fiscal caso Hermosilla)", "Luis Hermosilla", "Raúl Torrealba (exalcalde Vitacura)", "Mario Carrera (fiscal regional Arica)"], "pers": ["felipe sepúlveda", "luis hermosilla", "manuel guerra", "mario carrera", "raúl torrealba"], "fuentes": [{"titulo": "Manuel Guerra declaró que actual fiscal del Caso Hermosilla le reveló antecedentes de la investigación sobre el exalcalde Torrealba", "url": "https://www.ciperchile.cl/2025/06/17/manuel-guerra-declaro-que-actual-fiscal-del-caso-hermosilla-le-revelo-antecedentes-de-la-investigacion-sobre-el-exalcalde-torrealba/", "medio": "CIPER Chile, 17/06/2025"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-guerra-3.png", "generica": false, "imagenMedio": "CIPER Chile, 17/06/2025", "clave": false}, {"idx": 54, "n": 56, "fecha": "28 junio 2025", "anio": 2025, "titulo": "Arista bielorrusa: Fiscalía solicita al Banco Central los movimientos de Vivanco", "corto": "Arista bielorrusa", "desc": "En el marco de l ación constitucional…", "desc": "La Cámara de Diputados aprueba por amplia mayoría la acusación constitucional contra el juez de la Corte de Apelaciones de Santiago, Antonio Ulloa, por sus vínculos con Luis Hermosilla. Los capítulos acusados incluyen filtración de resoluciones reservadas al abogado, infracción al deber de abstención e imparcialidad, e intervención indebida en nombramientos judiciales. El Senado queda encargado de resolver la destitución.", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Antonio Ulloa (juez Corte de Apelaciones de Santiago)", "Cámara de Diputados", "Senado de Chile", "Luis Hermosilla"], "pers": ["antonio ulloa", "cámara de diputados", "luis hermosilla", "senado de chile"], "fuentes": [{"titulo": "Contundente votación: Cámara de Diputados aprueba AC contra juez Ulloa y Senado definirá si es destituido", "url": "https://www.eldinamo.cl/pais/2025/10/29/contundente-votacion-camara-de-diputados-aprueba-ac-contra-juez-ulloa-y-senado-definira-si-es-destituido-del-poder-judicial/", "medio": "El Dínamo, 29/10/2025"}], "imagen": "https://media.eldinamo.cl/2025/10/AC-juez-Antonio-Ulloa.png", "generica": false, "imagenMedio": "El Dínamo, 29/10/2025", "clave": true}, {"idx": 67, "n": 69, "fecha": "10 noviembre 2025", "anio": 2025, "titulo": "Senado destituye al juez Antonio Ulloa: cuarto magistrado removido por el caso", "corto": "Senado destituye al juez Antonio Ulloa", "desc": "El Senado aprueba los tres capítulos de la acusación constitucional contra el juez de la Corte de Apelaciones de Santiago, Antonio Ulloa, y lo destituye del Poder Judicial. El primer capítulo es aprobado por 44 votos a favor y 3 abstenciones; los capítulos segundo y tercero por mayorías más estrechas. Ulloa queda inhabilitado para ejercer cargos públicos por cinco años.", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Anto
