ucero con abogado del consorcio bielorruso redactó el fallo que entregó $1.026 millones a esa empresa", "url": "https://www.ciperchile.cl/2025/11/14/supremo-que-viajo-en-crucero-con-abogado-del-consorcio-bielorruso-redacto-el-fallo-que-entrego-1-026-millones-a-esa-empresa/", "medio": "CIPER Chile, 14/11/2025"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-ds.png", "generica": false, "imagenMedio": "CIPER Chile, 14/11/2025", "clave": false}, {"idx": 70, "n": 72, "fecha": "diciembre 2025", "anio": 2025, "titulo": "PDI: informe sobre Inversiones Guayasamín revela esquema de lavado de los Sauer", "corto": "PDI: informe sobre Inversiones Guayasamín revela esquema…", "desc": "La PDI emite un informe sobre Inversiones Guayasamín —empresa del clan Sauer— como pieza clave del lavado de activos. Según la investigación, mediante diversas sociedades los Sauer \"estructuraron un esquema fraudulento\" para dar apariencia de legalidad a su actividad ilícita ligada a delitos de estafa, infracción a la Ley de Mercado de Valores y actividad bancaria no autorizada. Guayasamín habría generado ventas por más de $24 mil millones.", "aristas": ["factop"], "principal": "factop", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["PDI", "Daniel Sauer", "Ariel Sauer", "Inversiones Guayasamín", "Fiscalía Metropolitana Oriente"], "pers": ["ariel sauer", "daniel sauer", "fiscalía metropolitana oriente", "inversiones guayasamín", "pdi"], "fuentes": [{"titulo": "Factop: PDI detalla cómo operó la \"máquina\" que fraguaron los hermanos Sauer y Rodrigo Topelberg", "url": "https://www.latercera.com/la-tercera-pm/noticia/factop-pdi-detalla-como-opero-la-maquina-que-fraguaron-los-hermanos-sauer-y-rodrigo-topelberg-en-la-genesis-del-caso-hermosilla/D7ZGU7KF5RHQDBWMH6H2PWHRCY/", "medio": "La Tercera"}], "imagen": "https://www.latercera.com/resizer/v2/2D2X23QMPBEZ7EHLL564FKWZ2E.png?auth=765d72a96989f3dd321bac48f58e3e3400e64bcd0fe6ba7d8be9b45b3c5ea108&height=630&width=1200&smart=true", "generica": false, "imagenMedio": "La Tercera", "clave": false}, {"idx": 71, "n": 73, "fecha": "22 diciembre 2025", "anio": 2025, "titulo": "Senado destituye al ministro Diego Simpertigue: quinto magistrado removido", "corto": "Senado destituye al ministro Diego Simpertigue", "desc": "El Senado destituye al ministro de la Corte Suprema Diego Simpertigue por notable abandono de deberes. Es el quinto magistrado removido en menos de dos años a raíz del caso. La cadena de destituciones —Ángela Vivanco, Sergio Muñoz (CS), Verónica Sabaj, Antonio Ulloa y Diego Simpertigue— refleja la crisis sistémica de credibilidad e independencia judicial gatillada por el Caso Hermosilla.", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Diego Simpertigue (ministro Corte Suprema)", "Senado de Chile", "Corte Suprema de Chile"], "pers": ["corte suprema de chile", "diego simpertigue", "senado de chile"], "fuentes": [{"titulo": "El quinto juez en dos años: Senado destituye a Diego Simpertigue por notable abandono de deberes", "url": "https://www.elmostrador.cl/noticias/pais/2025/12/22/el-quinto-juez-en-dos-anos-senado-destituye-a-diego-simpertigue-por-notable-abandono-de-deberes/", "medio": "El Mostrador, 22/12/2025"}, {"titulo": "Senado chileno destituye a otro juez de Corte Suprema y agudiza crisis en Poder Judicial", "url": "https://www.swissinfo.ch/spa/senado-chileno-destituye-a-otro-juez-de-corte-suprema-y-agudiza-crisis-en-poder-judicial/90679966", "medio": "SWI Swissinfo, 2025"}, {"titulo": "La crisis del Poder Judicial en Chile: El Caso Audios que golpeó por dentro y sigue destituyendo jueces", "url": "https://eldesconcierto.cl/2025/12/23/la-crisis-del-poder-judicial-en-chile-el-caso-audios-de-luis-hermosilla-que-golpeo-por-dentro-y-sigue-destituyendo-jueces", "medio": "El Desconcierto, 23/12/2025"}], "imagen": "https://media-front.elmostrador.cl/2025/12/A_UNO_1708684-700x467.jpg", "generica": false, "imagenMedio": "El Mostrador, 22/12/2025", "clave": true}, {"idx": 72, "n": 74, "fecha": "14 enero 2026", "anio": 2026, "titulo": "PDI allana domicilio de la exministra suprema María Teresa Letelier e incauta un aparato electrónico", "corto": "PDI allana domicilio de la exministra suprema María…", "desc": "Cuatro efectivos de la PDI realizan una diligencia en el domicilio de María Teresa Letelier —exministra de la Corte Suprema, jubilada el 24 de diciembre de 2025— a cargo de la Fiscal Regional de Valparaíso, Claudia Perivancich. La investigación detectó \"presuntas discordancias\" con la declaración que Letelier brindó en abril de 2025, en el marco de la arista de nombramientos judiciales. Se incauta un aparato electrónico. Letelier aparece en chats entre Hermosilla y el juez Mario Carroza: reconoció haber recibido a Hermosilla en abril de 2021, quien le ofreció \"ayuda para convertirse en integrante de ese tribunal\". El exjuez Juan Antonio Poblete habría realizado \"gestiones y lobby\" para facilitar su nombramiento a la Suprema.", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["María Teresa Letelier (exministra Corte Suprema)", "PDI", "Claudia Perivancich (fiscal regional Valparaíso)", "Luis Hermosilla", "Mario Carroza (exministro Corte Suprema)", "Juan Antonio Poblete (exjuez)"], "pers": ["claudia perivancich", "juan antonio poblete", "luis hermosilla", "mario carroza", "maría teresa letelier", "pdi"], "fuentes": [{"titulo": "Investigación por nombramientos judiciales: PDI realiza incautación en el domicilio de la exjueza suprema María Teresa Letelier", "url": "https://www.ciperchile.cl/2026/01/14/investigacion-por-nombramientos-judiciales-pdi-realiza-incautacion-en-el-domicilio-de-la-exjueza-suprema-maria-teresa-letelier/", "medio": "CIPER Chile, 14/01/2026"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-letelier-2.png", "generica": false, "imagenMedio": "CIPER Chile, 14/01/2026", "clave": true}, {"idx": 73, "n": 75, "fecha": "16 enero 2026", "anio": 2026, "titulo": "Fiscalía cierra investigación: se alista acusación formal", "corto": "Fiscalía cierra investigación: se alista acusación formal", "desc": "La Fiscalía Metropolitana Oriente cierra la investigación del caso Audio-Factop. A partir de esa fecha, el Ministerio Público tiene diez días para presentar la acusación formal e ir a juicio oral contra todos los imputados. Los fiscales Felipe Sepúlveda y Juan Pablo Araya confirman estar a punto de acusar a Luis Hermosilla, Leonarda Villalobos, Daniel Sauer, Antonio Jalaff y Álvaro Jalaff, entre otros.", "aristas": ["factop"], "principal": "factop", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Fiscalía Metropolitana Oriente", "Felipe Sepúlveda", "Juan Pablo Araya", "Luis Hermosilla", "María Leonarda Villalobos", "Daniel Sauer", "Antonio Jalaff", "Álvaro Jalaff"], "pers": ["antonio jalaff", "daniel sauer", "felipe sepúlveda", "fiscalía metropolitana oriente", "juan pablo araya", "luis hermosilla", "maría leonarda villalobos", "álvaro jalaff"], "fuentes": [{"titulo": "Llegó la hora de Luis Hermosilla: Fiscalía cierra investigación de caso Factop-Audio y alista acusación", "url": "https://www.latercera.com/nacional/noticia/llego-la-hora-de-luis-hermosilla-fiscalia-cierra-investigacion-de-caso-factop-audio-y-alista-acusacion/", "medio": "La Tercera"}, {"titulo": "Fiscales del Caso Audio preparan el cierre para ir a Juicio Oral", "url": "https://www.theclinic.cl/2025/10/05/fiscales-del-caso-audio-anuncian-acusacion-antes-de-fin-ano-y-se-refieren-al-telefono-de-luis-hermosilla-quizas-debe-haber-otros-celulares-con-gente-mas-poderosa-y-que-tenga-mas-informacion/", "medio": "The Clinic, 05/10/2025"}], "imagen": "https://www.latercera.com/resizer/v2/VZBIZ226PRAAJEPUVUFFJBU64E.png?auth=549903c0246dc714356ee9e09c1f0505b6f518d0a2479098318aba55be6381db&height=630&width=1200&focal=977%2C394", "generica": false, "imagenMedio": "La Tercera", "clave": true}, {"idx": 74, "n": 76, "fecha": "25 enero 2026", "anio": 2026, "titulo": "Formalización y prisión preventiva de Ángela Vivanco en la arista bielorrusa", "corto": "Formalización y prisión preventiva de Ángela Vivanco en…", "desc": "Personal del OS7 de Carabineros detiene a la exministra Ángela Vivanco en el marco de la arista bielorrusa, a solicitud de la Fiscalía Regional de Los Lagos. El 30 de enero, el tribunal decreta prisión preventiva por los delitos de cohecho y lavado de activos: la acusación sostiene que Vivanco habría favorecido al Consorcio Belaz-Movitec (CBM) en litigios contra Codelco desde la Tercera Sala de la Corte Suprema, recibiendo a cambio pagos cercanos a $90 millones canalizados a Gonzalo Migueles por los abogados Mario Vargas y Eduardo Lagos. Es la primera exministra de la Corte Suprema detenida y enviada a prisión preventiva en el contexto del Caso Hermosilla. Queda recluida en un centro de detención femenino.", "aristas": ["bielorrusa"], "principal": "bielorrusa", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Ángela Vivanco", "OS7 de Carabineros", "Fiscalía Regional de Los Lagos", "Gonzalo Migueles", "Mario Vargas (abogado CBM)", "Eduardo Lagos (abogado CBM)", "Consorcio Belaz-Movitec", "Codelco"], "pers": ["codelco", "consorcio belaz-movitec", "eduardo lagos", "fiscalía regional de los lagos", "gonzalo migueles", "mario vargas", "os7 de carabineros", "ángela vivanco"], "fuentes": [{"titulo": "Trama Bielorrusa: Justicia envió a prisión preventiva a la exmagistrada Ángela Vivanco", "url": "https://www.cooperativa.cl/noticias/pais/judicial/denuncias-de-corrupcion/trama-bielorrusa-justicia-envio-a-prision-preventiva-a-la/2026-01-30/121959.html", "medio": "Cooperativa, 30/01/2026"}, {"titulo": "\"Trama Bielorrusa\" en Chile: ex jueza de la Corte Suprema quedó recluida en un centro de detención femenino", "url": "https://www.infobae.com/america/america-latina/2026/01/27/trama-bielorrusa-en-chile-ex-jueza-de-la-corte-suprema-quedo-recluida-en-un-centro-de-detencion-femenino/", "medio": "Infobae, 27/01/2026"}, {"titulo": "Guía rápida para entender la \"trama bielorrusa\" y los cargos que se imputan contra Ángela Vivanco", "url": "https://www.biobiochile.cl/noticias/bbcl-explica/bbcl-explica-notas/2026/01/27/guia-rapida-para-entender-la-trama-bielorrusa-y-los-cargos-que-se-imputan-contra-angela-vivanco.shtml", "medio": "BioBioChile, 27/01/2026"}], "imagen": "https://www.cooperativa.cl/noticias/site/artic/20260130/imag/foto_0000000120260130121959.png", "generica": false, "imagenMedio": "Cooperativa, 30/01/2026", "clave": true}, {"idx": 75, "n": 77, "fecha": "27 enero 2026", "anio": 2026, "titulo": "Fiscalía de Aysén investigará a parlamentarios mencionados en la trama bielorrusa", "corto": "Fiscalía de Aysén investigará a parlamentarios…", "desc": "El fiscal nacional Ángel Valencia instruye que la arista política del caso —vinculada al consorcio Belaz-Movitec— quede a cargo de la Fiscalía Regional de Aysén, encabezada por el fiscal regional Hernán Libedinsky. El abogado Eduardo Lagos declaró que la senadora Loreto Carvajal (PPD) habría recibido $300 millones por intervenir en el nombramiento de Yamil Najle como conservador de bienes raíces de Chillán. Otros parlamentarios mencionados: Paulina Vodanovic (PS), Matías Walker (Demócratas), Sergio Gahona (UDI) y el diputado Cristián Araya (PR).", "aristas": ["politico-diplomatico"], "principal": "politico-diplomatico", "abre": ["politico-diplomatico"], "cruces": [], "enlaces": [{"idx": 74, "via": ["sale de la formalización de Vivanco"], "de": "bielorrusa", "manual": true}], "intervinientes": ["Ángel Valencia (fiscal nacional)", "Fiscalía Regional de Aysén", "Hernán Libedinsky (fiscal regional)", "Eduardo Lagos (abogado)", "Loreto Carvajal (senadora PPD)", "Paulina Vodanovic (senadora PS)", "Matías Walker (senador Demócratas)", "Sergio Gahona (senador UDI)", "Cristián Araya (diputado PR)", "Yamil Najle (conservador)", "Gabriel Silber"], "pers": ["cristián araya", "eduardo lagos", "fiscalía regional de aysén", "gabriel silber", "hernán libedinsky", "loreto carvajal", "matías walker", "paulina vodanovic", "sergio gahona", "yamil najle", "ángel valencia"], "fuentes": [{"titulo": "La arista política del caso Hermosilla: Fiscalía de Aysén investigará a parlamentarios mencionados en la causa del consorcio bielorruso", "url": "https://www.ciperchile.cl/2026/01/27/la-arista-politica-del-caso-hermosilla-fiscalia-de-aysen-investigara-a-parlamentarios-mencionados-en-la-causa-del-consorcio-bielorruso/", "medio": "CIPER Chile, 27/01/2026"}, {"titulo": "Fiscalía de Aysén abre investigación contra parlamentarios mencionados en la \"trama bielorrusa\"", "url": "https://www.t13.cl/noticia/nacional/fiscalia-aysen-abre-investigacion-contra-parlamentarios-mencionados-bielorrusa-27-1-2026", "medio": "T13, 27/01/2026"}, {"titulo": "Caso Hermosilla abre arista política y Fiscal Nacional traslada causa a Aysén como reservada", "url": "https://www.elmostrador.cl/noticias/pais/2026/01/27/caso-hermosilla-abre-arista-politica-y-fiscal-nacional-traslada-causa-a-aysen-como-reservada", "medio": "El Mostrador, 27/01/2026"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-lagos.png", "generica": false, "imagenMedio": "CIPER Chile, 27/01/2026", "clave": true}, {"idx": 76, "n": 78, "fecha": "27 enero 2026", "anio": 2026, "titulo": "OS7 descubre 26 cajas de documentos de Vivanco en bodega del conservador Yáber", "corto": "OS7 descubre 26 cajas de documentos de Vivanco en bodega…", "desc": "El mismo día en que se conoce la detención de Vivanco, el OS7 de Carabineros descubre 26 cajas con documentos de la exministra y de Gonzalo Migueles en una bodega del Conservador de Bienes Raíces de Puente Alto, a cargo de Sergio Yáber. Solo dos cajas contienen material de interés investigativo: tres archivadores con documentación contable entre 2009 y 2022 —\"cuentas personales 2009-2015\", \"pagos y documentos 2015-2018\" y \"cuentas pagadas 24-09-18 a abril 2022\"—. Escuchas telefónicas previas revelan que Vivanco intentó contactar a los conservadores cuando la investigación estaba aún en reserva.", "aristas": ["bielorrusa"], "principal": "bielorrusa", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["OS7 de Carabineros", "Ángela Vivanco", "Gonzalo Migueles", "Sergio Yáber (conservador Puente Alto)", "Yamil Najle", "Marco Muñoz (fiscal)", "Fiscalía Regional de Los Lagos"], "pers": ["fiscalía regional de los lagos", "gonzalo migueles", "marco muñoz", "os7 de carabineros", "sergio yáber", "yamil najle", "ángela vivanco"], "fuentes": [{"titulo": "OS7 encontró 26 cajas de Vivanco y Migueles en una bodega del conservador Yáber: incautó tres archivadores con información contable", "url": "https://www.ciperchile.cl/2026/03/18/os7-encontro-26-cajas-de-vivanco-y-migueles-en-una-bodega-del-conservador-yaber-incauto-tres-archivadores-con-informacion-contable/", "medio": "CIPER Chile, 18/03/2026"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/web-vivanco-1.png", "generica": false, "imagenMedio": "CIPER Chile, 18/03/2026", "clave": false}, {"idx": 77, "n": 79, "fecha": "27 enero 2026", "anio": 2026, "titulo": "Fiscalía revela que Chadwick es imputado en causa reservada", "corto": "Fiscalía revela que Chadwick es imputado en causa…", "desc": "La fiscal regional Oriente, Lorena Parra, revela que Andrés Chadwick figura como imputado en una causa reservada de esa fiscalía —independiente de la causa Guerra— que investiga pagos de Hermosilla a Chadwick y las actuaciones que ambos realizaron en favor de clientes privados, entre ellos Clínica Las Condes, Huawei, Graneles de Chile, AFP Plan Vital, Grupo Patio y Vivo Corp. Según fuentes con acceso al caso, de las cuentas bancarias de Hermosilla y sus empresas se transfirieron al menos $226 millones en favor de Chadwick. Chadwick mantiene el estatus de imputado en tres causas distintas del Ministerio Público.", "aristas": ["politico-diplomatico"], "principal": "politico-diplomatico", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Andrés Chadwick (exministro Interior)", "Lorena Parra (fiscal regional Oriente)", "Luis Hermosilla", "Fiscalía Metropolitana Oriente"], "pers": ["andrés chadwick", "fiscalía metropolitana oriente", "lorena parra", "luis hermosilla"], "fuentes": [{"titulo": "Sigue en la mira: Fiscalía revela que Andrés Chadwick es imputado en causa reservada", "url": "https://www.biobiochile.cl/noticias/nacional/chile/2026/01/27/sigue-en-la-mira-fiscalia-confirma-que-andres-chadwick-es-imputado-en-causa-reservada.shtml", "medio": "BioBioChile, 27/01/2026"}, {"titulo": "Las tres causas que mantiene la Fiscalía contra Andrés Chadwick en medio del caso Hermosilla", "url": "https://www.elmostrador.cl/noticias/pais/2026/02/10/las-tres-causas-que-mantiene-la-fiscalia-contra-andres-chadwick-en-medio-del-caso-hermosilla/", "medio": "El Mostrador, 10/02/2026"}], "imagen": "https://media.biobiochile.cl/wp-content/uploads/2026/01/social-fiscalia-confirma-que-andres-chadwick-es-imputado-en-causa-reservada-tras-cierre-de-factop.png", "generica": false, "imagenMedio": "BioBioChile, 27/01/2026", "clave": false}, {"idx": 78, "n": 80, "fecha": "28 enero 2026", "anio": 2026, "titulo": "Fiscalía presenta acusación formal: 10 imputados y penas de hasta 20 años de presidio", "corto": "Fiscalía presenta acusación formal", "desc": "Tras el cierre de la investigación el 16 de enero, la Fiscalía Metropolitana Oriente presenta la acusación formal contra 10 imputados en el caso Audio-Factop. Las penas solicitadas son: Daniel Sauer (20 años), María Leonarda Villalobos (18 años), Luis Hermosilla (14 años), Ariel Sauer (14 años), Álvaro Jalaff (13 años), Luis Flores (12 años), Antonio Jalaff (10 años y un día), Rodrigo Topelberg (7 años), Cristián Menichetti (6 años y 2 días) y Luis Angulo (5 años y un día). La fiscal Lorena Parra confirma que los tres directamente involucrados en el audio —Hermosilla, Villalobos y Daniel Sauer— irán a juicio oral \"sin ninguna duda\".", "aristas": ["factop"], "principal": "factop", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Fiscalía Metropolitana Oriente", "Lorena Parra (fiscal regional Oriente)", "Luis Hermosilla", "María Leonarda Villalobos", "Daniel Sauer", "Ariel Sauer", "Álvaro Jalaff", "Antonio Jalaff", "Luis Flores", "Rodrigo Topelberg", "Cristián Menichetti", "Luis Angulo"], "pers": ["antonio jalaff", "ariel sauer", "cristián menichetti", "daniel sauer", "fiscalía metropolitana oriente", "lorena parra", "luis angulo", "luis flores", "luis hermosilla", "maría leonarda villalobos", "rodrigo topelberg", "álvaro jalaff"], "fuentes": [{"titulo": "Estas son las penas que Fiscalía solicita para los 10 imputados del Caso Audios: llegan hasta los 20 años de presidio", "url": "https://www.cnnchile.com/pais/penas-fiscalia-10-imputados-caso-audios-hermosilla-topelberg_20260128/", "medio": "CNN Chile, 28/01/2026"}], "imagen": "https://media.cnnchile.com/2026/01/SALA-DE-AUDIENCIAS-MINISTERIO-PUBLICO-FISCALIA-CASO-AUDIOS-PENAS-PARA-LOS-IMPUTADOS-768x512.jpg", "generica": false, "imagenMedio": "CNN Chile, 28/01/2026", "clave": true}, {"idx": 79, "n": 81, "fecha": "30 enero 2026", "anio": 2026, "titulo": "Hermosilla arremete contra la fiscal Parra en audiencia de cautelares", "corto": "Hermosilla arremete contra la fiscal Parra en audiencia…", "desc": "En audiencia de revisión de medidas cautelares, Luis Hermosilla acusa públicamente a la fiscal regional Lorena Parra de haberle pedido que interviniera ante ministros de la Corte a su favor: \"No solo me mandó su currículum; me pidió que interviniera\" e \"insistió y me pidió cuenta de cómo iban las gestiones\". También la acusa de haberse convertido en \"una especie de influencer que graba y hace videos\" para redes sociales antes de conocerse la acusación formal. El tribunal mantiene el arresto domiciliario total de Hermosilla; este anuncia que apelará.", "aristas": ["audio-sii"], "principal": "audio-sii", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Luis Hermosilla", "Lorena Parra (fiscal regional Oriente)"], "pers": ["lorena parra", "luis hermosilla"], "fuentes": [{"titulo": "Hermosilla arremete contra fiscal Parra: \"No sólo me mandó su currículum, me pidió que interviniera con ministros de la Corte\"", "url": "https://www.emol.com/noticias/Nacional/2026/01/30/1190129/hermosilla-arremete-contra-fiscalparra.html", "medio": "Emol, 30/01/2026"}], "imagen": "https://static.emol.cl/emol50/Fotos/2026/01/30/file_20260130130057.jpg", "generica": false, "imagenMedio": "Emol, 30/01/2026", "clave": false}, {"idx": 80, "n": 82, "fecha": "9 febrero 2026", "anio": 2026, "titulo": "Corte de Apelaciones mantiene prisión preventiva de Vivanco", "corto": "Corte de Apelaciones mantiene prisión preventiva de…", "desc": "La Corte de Apelaciones de Santiago rechaza la apelación de la defensa de Ángela Vivanco y mantiene la prisión preventiva decretada el 30 de enero. El tribunal acoge los argumentos de la Fiscalía Regional de Los Lagos, que sostiene tener suficiente evidencia para mantener la medida. Los cuatro imputados en la arista —Vivanco, Gonzalo Migueles, Mario Vargas y Eduardo Lagos— permanecen en prisión preventiva.", "aristas": ["bielorrusa"], "principal": "bielorrusa", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Ángela Vivanco", "Gonzalo Migueles", "Mario Vargas", "Eduardo Lagos", "Corte de Apelaciones de Santiago", "Fiscalía Regional de Los Lagos"], "pers": ["corte de apelaciones de santiago", "eduardo lagos", "fiscalía regional de los lagos", "gonzalo migueles", "mario vargas", "ángela vivanco"], "fuentes": [{"titulo": "Trama Bielorrusa: los argumentos de la Corte de Apelaciones para mantener a Ángela Vivanco en prisión preventiva", "url": "https://www.eldinamo.cl/pais/2026/02/09/trama-bielorrusa-los-argumentos-de-la-corte-de-apelaciones-para-mantener-a-angela-vivanco-en-prision-preventiva/", "medio": "El Dínamo, 09/02/2026"}, {"titulo": "Tribunal mantiene prisión preventiva para exsuprema Ángela Vivanco", "url": "https://www.latercera.com/nacional/noticia/tribunal-mantiene-prision-preventiva-para-exsuprema-angela-vivanco/", "medio": "La Tercera"}], "imagen": "https://media.eldinamo.cl/2026/02/Angela-Vivanco-5.png", "generica": false, "imagenMedio": "El Dínamo, 09/02/2026", "clave": true}, {"idx": 81, "n": 83, "fecha": "13 febrero 2026", "anio": 2026, "titulo": "CIPER publica los audios originales de escuchas telefónicas de la causa bielorrusa", "corto": "CIPER publica los audios originales de escuchas…", "desc": "CIPER publica ocho registros de conversaciones interceptadas por el OS7 de Carabineros en la investigación del Consorcio Belaz-Movitec (CBM). Los audios revelan presuntas coimas, lavado de dinero y presiones a autoridades judiciales. Entre los elementos clave: el conservador Yamil Najle transfirió $25 millones fraccionados a Gonzalo Migueles; el conservador Sergio Yáber habría transferido ~$78 millones a Antonio Ulloa en seis años; a la exministra Vivanco habrían llegado \"palitos de dólares\"; y al diputado republicano Cristián Araya se le habrían pagado $1,7 millones. Los audios también mencionan al ministro de la Corte Suprema Arturo Prado en el contexto de las coordinaciones.", "aristas": ["bielorrusa"], "principal": "bielorrusa", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Sergio Yáber (conservador Puente Alto)", "Yamil Najle (conservador Chillán)", "Ángela Vivanco", "Gonzalo Migueles", "Mario Vargas", "Eduardo Lagos", "Cristián Araya (diputado republicano)", "Antonio Ulloa", "Arturo Prado (ministro Corte Suprema)", "OS7 de Carabineros", "CIPER Chile"], "pers": ["antonio ulloa", "arturo prado", "ciper chile", "cristián araya", "eduardo lagos", "gonzalo migueles", "mario vargas", "os7 de carabineros", "sergio yáber", "yamil najle", "ángela vivanco"], "fuentes": [{"titulo": "Estos son los audios originales de las escuchas telefónicas que la f o": "El Mostrador, 17/06/2026", "clave": true}, {"idx": 99, "n": 101, "fecha": "22 junio 2026", "anio": 2026, "titulo": "Jalaff firma acuerdo con la Fiscalía: procedimiento abreviado fijado para julio", "corto": "Jalaff firma acuerdo con la Fiscalía", "desc": "BioBioChile revela que Álvaro Jalaff firmó un acuerdo con la Fiscalía bajo la modalidad de procedimiento abreviado, con audiencia programada para el 27 de julio de 2026. A cambio de su confesión y de comprometer a Luis Hermosilla y al exministro Felipe Ward, Jalaff obtiene beneficios procesales: rebaja de pena por colaboración eficaz y cambio de medida cautelar desde arresto domiciliario parcial a firma mensual. El acuerdo tiene carácter reservado según fuentes judiciales consultadas por el medio.", "aristas": ["parque-capital"], "principal": "parque-capital", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Álvaro Jalaff", "Fiscalía de Alta Complejidad Metropolitana Oriente", "Luis Hermosilla"], "pers": ["fiscalía de alta complejidad metropolitana oriente", "luis hermosilla", "álvaro jalaff"], "fuentes": [{"titulo": "\"Entregó a Lucho\": Álvaro Jalaff deja caer a Hermosilla y firma acuerdo con la fiscalía", "url": "https://www.biobiochile.cl/especial/bbcl-investiga/noticias/de-pasillo/2026/06/22/entrego-a-lucho-alvaro-jalaff-deja-caer-a-hermosilla-y-firma-acuerdo-con-la-fiscalia.shtml", "medio": "BioBioChile, 22/06/2026"}], "imagen": "https://media.biobiochile.cl/wp-content/uploads/2026/06/social-jalaff-hermosilla.png", "generica": false, "imagenMedio": "BioBioChile, 22/06/2026", "clave": false}, {"idx": 100, "n": 102, "fecha": "22 junio 2026", "anio": 2026, "titulo": "CDE se querella contra Hermosilla y Jalaff en el Cuarto Juzgado de Garantía por arista Parque Capital", "corto": "CDE se querella contra Hermosilla y Jalaff en el Cuarto…", "desc": "El Consejo de Defensa del Estado presenta una querella en el Cuarto Juzgado de Garantía de Santiago contra Luis Hermosilla y Álvaro Jalaff por los hechos de la arista Parque Capital. A Hermosilla se le imputan cohecho agravado y tráfico de influencias; a Jalaff, soborno. La querella se sustenta en la declaración del 4 de junio en que Jalaff reconoció pagos en efectivo a Hermosilla en 2019 (aproximadamente $300 millones, sumados luego al resto hasta totalizar 10.000 UF) para destrabar permisos del Ministerio de Vivienda. Menciona también al exministro Felipe Ward y al seremi metropolitano de Vivienda Manuel José Errázuriz como funcionarios cuyas decisiones se habrían visto influenciadas. Los permisos del proyecto Parque Capital fueron aprobados en agosto de 2021.", "aristas": ["parque-capital"], "principal": "parque-capital", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Consejo de Defensa del Estado (CDE)", "Luis Hermosilla", "Álvaro Jalaff", "Felipe Ward (exministro de Vivienda)", "Manuel José Errázuriz (seremi Metropolitano de Vivienda)", "Cuarto Juzgado de Garantía de Santiago"], "pers": ["consejo de defensa del estado", "cuarto juzgado de garantía de santiago", "felipe ward", "luis hermosilla", "manuel josé errázuriz", "álvaro jalaff"], "fuentes": [{"titulo": "CDE se querella contra Luis Hermosilla y Álvaro Jalaff por caso Parque Capital", "url": "https://www.elmostrador.cl/noticias/pais/2026/06/22/cde-se-querella-contra-luis-hermosilla-y-alvaro-jalaff-por-caso-parque-capital/", "medio": "El Mostrador, 22/06/2026"}], "imagen": "https://media-front.elmostrador.cl/2026/06/jalaff.jpeg", "generica": false, "imagenMedio": "El Mostrador, 22/06/2026", "clave": false}, {"idx": 101, "n": 103, "fecha": "22 junio 2026", "anio": 2026, "titulo": "El Colegio de Abogados expulsa a Luis Hermosilla en fallo unánime", "corto": "El Colegio de Abogados expulsa a Luis Hermosilla en fallo…", "desc": "Se hace pública la sentencia del Tribunal Ético del Colegio de Abogados de Chile que, con fecha 4 de junio, resolvió por unanimidad expulsar a Luis Hermosilla del gremio por infracciones al Código de Ética Profesional derivadas de los hechos públicos y notorios del Caso Audio. Es la sanción máxima que contempla la orden gremial. Hermosilla presentó el 17 de junio un recurso de apelación que será conocido por la Corte de Apelaciones de Santiago.", "aristas": ["audio-sii"], "principal": "audio-sii", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Luis Hermosilla", "Colegio de Abogados de Chile", "Tribunal Ético del Colegio de Abogados", "Corte de Apelaciones de Santiago"], "pers": ["colegio de abogados de chile", "corte de apelaciones de santiago", "luis hermosilla", "tribunal ético del colegio de abogados"], "fuentes": [{"titulo": "Caso Audio: Colegio de Abogados expulsa a Luis Hermosilla en fallo unánime", "url": "https://www.emol.com/noticias/Nacional/2026/06/22/1203584/colegio-abogados-expulsa-luis-hermosilla.html", "medio": "Emol, 22/06/2026"}, {"titulo": "Decisión unánime: Colegio de Abogados expulsa a Luis Hermosilla tras investigación ética en su contra por Caso Audio", "url": "https://www.latercera.com/nacional/noticia/colegio-de-abogados-expulsa-a-luis-hermosilla-tras-investigacion-etica-en-su-contra-por-caso-audio/", "medio": "La Tercera, 22/06/2026"}], "imagen": "https://static.emol.cl/emol50/Fotos/2026/06/22/file_20260622191656.jpg", "generica": false, "imagenMedio": "Emol, 22/06/2026", "clave": true}, {"idx": 102, "n": 104, "fecha": "25 junio 2026", "anio": 2026, "titulo": "\"Eres mi ángel de la guarda\": Reportea revela chats de Hermosilla con dos juezas más", "corto": "\"Eres mi ángel de la guarda\"", "desc": "Reportea publica una nueva tanda de conversaciones extraídas del teléfono de Luis Hermosilla que exponen su relación con dos magistradas hasta entonces no vinculadas públicamente al caso: la ministra de la Corte de Apelaciones de Santiago Lilian Leyton y la jueza del 1er Juzgado Civil de Santiago Isabel Margarita Zúñiga. Leyton, cuando era relatora, entregaba información al penalista, le pedía apoyo para su nombramiento como ministra, comentaba perfiles de otros jueces y respondía consultas sobre causas específicas. Zúñiga —que trabajó varios meses con Hermosilla— le solicitaba gestiones en su favor y en beneficio de personas cercanas para facilitar ascensos en el Poder Judicial. Los chats se suman al patrón ya documentado con Verónica Sabaj y consolidan la tesis de una red de tráfico de influencias dentro del Poder Judicial.", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Luis Hermosilla", "Lilian Leyton (ministra Corte de Apelaciones de Santiago)", "Isabel Margarita Zúñiga (jueza 1er Juzgado Civil de Santiago)", "Verónica Sabaj", "Reportea"], "pers": ["isabel margarita zúñiga", "lilian leyton", "luis hermosilla", "reportea", "verónica sabaj"], "fuentes": [{"titulo": "\"Eres mi ángel de la guarda\": las desconocidas informantes y amigas íntimas de Hermosilla en el Poder Judicial", "url": "https://reportea.cl/2026/06/25/eres-mi-angel-de-la-guarda-las-desconocidas-informantes-y-amigas-intimas-de-hermosilla-en-el-poder-judicial/", "medio": "Reportea, 25/06/2026"}, {"titulo": "\"Mi ángel de la guarda\": revelan chats de Hermosilla con juezas para influir en causas y nombramientos", "url": "https://www.biobiochile.cl/noticias/nacional/chile/2026/06/25/mi-angel-de-la-guarda-revelan-chats-de-hermosilla-con-juezas-para-influir-en-causas-y-nombramientos.shtml", "medio": "BioBioChile, 25/06/2026"}, {"titulo": "Sabaj, Leyton y Zúñiga: la amistad de Hermosilla con 3 juezas que derivó en tráfico de influencias en el Poder Judicial", "url": "https://eldesconcierto.cl/actualidad/sabaj-leyton-y-zuniga-la-amistad-hermosilla-3-juezas-que-derivo-trafico-influencias-el-poder-judicial-n5459959", "medio": "El Desconcierto"}], "imagen": "https://reportea.cl/wp-content/uploads/2026/06/portada-chats-secretos-hermosilla-5-1.jpg", "generica": false, "imagenMedio": "Reportea, 25/06/2026", "clave": false}, {"idx": 103, "n": 105, "fecha": "2 julio 2026", "anio": 2026, "titulo": "La Corte de Santiago abre sumario contra la jueza Zúñiga, pero salva a la ministra Leyton invocando cosa juzgada", "corto": "La Corte de Santiago abre sumario contra la jueza Zúñiga…", "desc": "El pleno de la Corte de Apelaciones de Santiago resuelve de manera dispar frente a los chats revelados por Reportea. Ordena instruir sumario administrativo contra la jueza Isabel Margarita Zúñiga del 1er Juzgado Civil de Santiago. En cambio, por mayoría decide **no** abrir un nuevo sumario contra la ministra Lilian Leyton, argumentando cosa juzgada: la magistrada ya había sido objeto de un proceso disciplinario en 2024 que terminó con sobreseimiento unánime. Algunos ministros propusieron reabrir la investigación sin éxito. La decisión es criticada como un \"salvataje\" corporativo y deja a Leyton en el radar de la Fiscalía y de los querellantes, que presionan por abrir una causa penal.", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Corte de Apelaciones de Santiago", "Lilian Leyton", "Isabel Margarita Zúñiga", "Luis Hermosilla", "Reportea"], "pers": ["corte de apelaciones de santiago", "isabel margarita zúñiga", "lilian leyton", "luis hermosilla", "reportea"], "fuentes": [{"titulo": "Corte ordena sumario a nueva jueza por chats con Hermosilla (Radar 02-07-2026)", "url": "https://www.ciperchile.cl/2026/07/02/radar-02-07-2026/", "medio": "CIPER Chile, 02/07/2026"}, {"titulo": "El salvataje de la Corte de Santiago a la ministra Lilian Leyton por sus chats con Luis Hermosilla", "url": "https://www.latercera.com/nacional/noticia/el-salvataje-de-la-corte-de-santiago-a-la-ministra-lilian-leyton-por-sus-chats-con-luis-hermosilla/", "medio": "La Tercera"}, {"titulo": "Ministra Leyton entra en el radar de la Fiscalía y querellantes presionan para abrir causa por sus chats con Hermosilla", "url": "https://www.latercera.com/nacional/noticia/ministra-leyton-entra-en-el-radar-de-la-fiscalia-y-querellantes-presionan-para-abrir-causa-por-sus-chats-con-hermosilla/", "medio": "La Tercera"}], "imagen": "https://www.latercera.com/resizer/v2/GLNJRLT24VDBFKOZUUGRDNSJ4U.jpg?auth=e4ccb4c39a99657b0a2f402c58dd954bf7a481725cc04f9d6022c962e0f83b5a&height=630&width=1200&smart=true", "generica": false, "imagenMedio": "La Tercera", "clave": false}, {"idx": 104, "n": 106, "fecha": "3 julio 2026", "anio": 2026, "titulo": "Reportea revela que el \"agente topo\" de Hermosilla en la PDI dirigía la contrainteligencia de la ANI; renuncia dos días después", "corto": "Reportea revela que el \"agente topo\" de Hermosilla en la…", "desc": "Una investigación de Reportea, basada en un informe de más de 470 páginas, revela que el exprefecto general de la PDI Paulo Contreras —segundo al mando de la institución tras la caída de Sergio Muñoz— mantuvo entre 2018 y 2023 un intercambio de información reservada con Luis Hermosilla: datos de investigaciones judiciales, reportes de inteligencia policial y movimientos de figuras públicas (entre ellos, la ubicación de Daniel Jadue en el extranjero y antecedentes de generales de Carabineros durante evaluaciones de ascensos), vía WhatsApp, Telegram y reuniones presenciales. Contreras había asumido en marzo de 2026, con la llegada del presidente Kast, como jefe de la División de Contrainteligencia de la Agencia Nacional de Inteligencia (ANI). El 5 de julio, tras la divulgación de los chats, renuncia al cargo, según confirma el Ministerio del Interior.", "aristas": ["pdi"], "principal": "pdi", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Paulo Contreras (exprefecto PDI", "exjefe de Contrainteligencia ANI)", "Luis Hermosilla", "ANI", "PDI", "Ministerio del Interior", "Reportea"], "pers": ["ani", "exjefe de contrainteligencia ani)", "luis hermosilla", "ministerio del interior", "paulo contreras", "pdi", "reportea"], "fuentes": [{"titulo": "El \"agente topo\" de Hermosilla en la PDI dio el salto a la ANI con Kast: dirige contrainteligencia", "url": "https://www.elmostrador.cl/noticias/pais/2026/07/03/el-agente-topo-de-hermosilla-en-la-pdi-dio-el-salto-a-la-ani-con-kast-dirige-contrainteligencia/", "medio": "El Mostrador, 03/07/2026"}, {"titulo": "Jefe de Contrainteligencia de la ANI renuncia a su cargo tras divulgación de chats con Luis Hermosilla", "url": "https://www.emol.com/noticias/Nacional/2026/07/05/1204717/contrainteligencia-ani-hermosilla-renuncia-contreras.html", "medio": "Emol, 05/07/2026"}], "imagen": "https://media-front.elmostrador.cl/2026/07/WhatsApp-Image-2026-07-03-at-2.51.45-PM-700x350.jpeg", "generica": false, "imagenMedio": "El Mostrador, 03/07/2026", "clave": true}, {"idx": 105, "n": 107, "fecha": "6 julio 2026", "anio": 2026, "titulo": "A tres años del audio: Hermosilla apela su expulsión y pide volver a declarar; arriesga más de 20 años solo en la arista Audios", "corto": "A tres años del audio", "desc": "Al cumplirse tres años de la grabación del audio que destapó el caso, El Mostrador repasa la situación procesal de Luis Hermosilla: el exabogado apeló ante la Corte de Apelaciones de Santiago la expulsión dictada por el Tribunal Ético del Colegio de Abogados y solicitó volver a declarar ante la Fiscalía Oriente. Tras la confesión de Álvaro Jalaff sobre la coima de $410 millones por Parque Capital, Hermosilla arriesga más de 20 años de cárcel solo en la arista Audios, con investigaciones repartidas en tres fiscalías distintas.", "aristas": ["audio-sii"], "principal": "audio-sii", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Luis Hermosilla", "Colegio de Abogados de Chile", "Corte de Apelaciones de Santiago", "Fiscalía Oriente", "Álvaro Jalaff"], "pers": ["colegio de abogados de chile", "corte de apelaciones de santiago", "fiscalía oriente", "luis hermosilla", "álvaro jalaff"], "fuentes": [{"titulo": "A tres años del explosivo audio: los últimos cartuchos de Hermosilla", "url": "https://www.elmostrador.cl/noticias/multimedia/punto-por-punto/2026/07/06/a-tres-anos-del-explosivo-audio-los-ultimos-cartuchos-de-hermosilla/", "medio": "El Mostrador, 06/07/2026"}], "imagen": "https://media-front.elmostrador.cl/2026/07/6-julio-punto-por-punto-700x394.jpg", "generica": false, "imagenMedio": "El Mostrador, 06/07/2026", "clave": false}, {"idx": 106, "n": 108, "fecha": "23 julio 2026", "anio": 2026, "titulo": "Fijan para el 26 de octubre la formalización de Hermosilla por el soborno al exfiscal Guerra", "corto": "Fijan para el 26 de octubre la formalización de…", "desc": "El Cuarto Juzgado de Garantía de Santiago fija para el 26 de octubre de 2026 la audiencia de formalización de Luis Hermosilla en la arista del exfiscal Manuel Guerra. A solicitud del fiscal regional de Arica Mario Carrera, se le imputarán los delitos de **cohecho agravado, soborno y violación de secreto**. La imputación se sustenta en los chats de WhatsApp extraídos del teléfono del penalista: entre 2016 y 2023 Guerra le habría filtrado información de investigaciones que dirigía y que involucraban a personas cercanas a Hermosilla, y —mientras Hermosilla era asesor del Ministerio del Interior en el gobierno de Sebastián Piñera— habría favorecido a imputados en causas contra figuras políticas de ese sector, incluido el propio expresidente. La contraprestación se habría materializado en la contratación de Guerra en la Universidad San Sebastián en 2021, casa de estudios donde Andrés Chadwick era decano. Guerra fue formalizado por estos mismos hechos en marzo de 2026 y permanece en prisión preventiva.", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Luis Hermosilla", "Manuel Guerra (exfiscal regional Oriente)", "Mario Carrera (fiscal regional Arica)", "Cuarto Juzgado de Garantía de Santiago", "Andrés Chadwick", "Universidad San Sebastián", "Sebastián Piñera"], "pers": ["andrés chadwick", "cuarto juzgado de garantía de santiago", "luis hermosilla", "manuel guerra", "mario carrera", "sebastián piñera", "universidad san sebastián"], "fuentes": [{"titulo": "Fijan audiencia para formalizar a Hermosilla por presunto soborno en la investigación del exfiscal Manuel Guerra", "url": "https://www.ciperchile.cl/2026/07/23/fijan-audiencia-para-formalizar-a-hermosilla-por-presunto-soborno-en-la-investigacion-del-exfiscal-manuel-guerra/", "medio": "CIPER Chile, 23/07/2026"}, {"titulo": "Chats y favores al piñerismo: Hermosilla será formalizado por cohecho, soborno y violación de secreto", "url": "https://www.elciudadano.com/chile/chats-y-favores-al-pinerismo-hermosilla-sera-formalizado-por-cohecho-soborno-y-violacion-de-secreto/07/24/", "medio": "El Ciudadano, 24/07/2026"}, {"titulo": "Hermosilla nuevamente a tribunales: fiscal Carrera prepara formalización contra el abogado en arista Manuel Guerra", "url": "https://www.latercera.com/nacional/noticia/hermosilla-nuevamente-a-tribunales-fiscal-carrera-prepara-formalizacion-contra-el-abogado-en-arista-manuel-guerra/", "medio": "La Tercera"}], "imagen": "https://www.ciperchile.cl/wp-content/uploads/hermosilla_guerra_v1_HOME.png", "generica": false, "imagenMedio": "CIPER Chile, 23/07/2026", "clave": true}, {"idx": 107, "n": 109, "fecha": "27 julio 2026", "anio": 2026, "titulo": "\"¿Hago algo con Manuel Guerra?\": nuevos chats de Telegram acorralan a Chadwick", "corto": "\"¿Hago algo con Manuel Guerra?\"", "desc": "Reportea revela conversaciones por **Telegram** entre Luis Hermosilla y Andrés Chadwick, un canal que el penalista reservaba para sus contactos de mayor confianza mientras usaba WhatsApp para comunicaciones menos sensibles. En abril de 2018, tras la caída de un acuerdo fiscal en el caso del empresario Santiago Valdés, Hermosilla escribe: \"¿Hago algo en relación con esta noticia con MG?\" —en referencia a Manuel Guerra— y Chadwick responde: \"Bueno … cuánto?\". Los mensajes también documentan seguimiento a las investigaciones del Caso Penta sobre financiamiento electoral, gestiones para que el senador Iván Moreira pagara íntegras las facturas cuestionadas, la indagatoria de Minera Dominga y discusiones sobre el control de querellas y cambios administrativos en el Servicio de Impuestos Internos. Los chats provienen de las 12.135 páginas del teléfono de Hermosilla cuya incorporación autorizó el Cuarto Juzgado de Garantía el 18 de mayo de 2026, ingresadas por la Fiscalía de Arica. Los mensajes de Telegram aún no habían sido periciados por el Ministerio Público —solo los de WhatsApp—, pese a estar respaldados en el dispositivo incautado en noviembre de 2023. Chadwick mantiene la calidad de imputado; el fiscal Mario Carrera había señalado que \"aparece, pero nunca tenemos alguna acción directa de él\".", "aristas": ["poder-judicial"], "principal": "poder-judicial", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Luis Hermosilla", "Andrés Chadwick", "Manuel Guerra", "Mario Carrera (fiscal regional Arica)", "Cuarto Juzgado de Garantía de Santiago", "Santiago Valdés (empresario)", "Iván Moreira (senador)", "Fiscalía de Arica", "Reportea"], "pers": ["andrés chadwick", "cuarto juzgado de garantía de santiago", "fiscalía de arica", "iván moreira", "luis hermosilla", "manuel guerra", "mario carrera", "reportea", "santiago valdés"], "fuentes": [{"titulo": "¿Hago algo con Manuel Guerra?: nuevos chats de Hermosilla acorralan a Chadwick y revelan conversaciones secretas por Telegram", "url": "https://reportea.cl/2026/07/27/hago-algo-con-manuel-guerra-nuevos-chats-de-hermosilla-acorralan-a-chadwick-y-revelan-conversaciones-secretas-por-telegram/", "medio": "Reportea, 27/07/2026"}, {"titulo": "Chats por Telegram entre Hermosilla y Chadwick abren una nueva arista en el caso Guerra", "url": "https://www.elmostrador.cl/noticias/pais/2026/07/28/chats-por-telegram-entre-hermosilla-y-chadwick-abren-una-nueva-arista-en-el-caso-guerra/", "medio": "El Mostrador, 28/07/2026"}, {"titulo": "Qué dicen los nuevos chats entre Luis Hermosilla y Andrés Chadwick que fueron incorporados a la causa contra exfiscal Guerra", "url": "https://www.eldinamo.cl/pais/2026/07/28/que-dicen-los-nuevos-chats-entre-luis-hermosilla-y-andres-chadwick-que-fueron-incorporados-a-la-causa-contra-exfiscal-guerra/", "medio": "El Dínamo, 28/07/2026"}], "imagen": "https://reportea.cl/wp-content/uploads/2026/07/portada-chats-secretos-hermosilla-7-ok.jpg", "generica": false, "imagenMedio": "Reportea, 27/07/2026", "clave": false}, {"idx": 108, "n": 110, "fecha": "28 julio 2026", "anio": 2026, "titulo": "Vivanco rompe su silencio: declarará el 5 de agosto ante la Fiscalía por la trama bielorrusa", "corto": "Vivanco rompe su silencio", "desc": "El Mostrador informa que Ángela Vivanco prestará su primera declaración como imputada en la arista \"Muñeca Bielorrusa\" el miércoles 5 de agosto de 2026, ante la fiscal regional de Los Lagos Carmen Gloria Wittwer, en dependencias del OS7 de Carabineros en Providencia. La exministra de la Corte Suprema —hoy en arresto domiciliario total tras más de cuatro meses en prisión preventiva— es investigada por cohecho y lavado de activos: se le acusa de recibir sobornos a través de su expareja Gonzalo Migueles, provenientes de los abogados Eduardo Lagos Herrera y Mario Vargas, para favorecer al consorcio Belaz Movitec en su litigio contra Codelco. Para el 13 de agosto está fijada una audiencia sobre las cautelares de Lagos y la ampliación del plazo de investigación.", "aristas": ["bielorrusa"], "principal": "bielorrusa", "abre": [], "cruces": [], "enlaces": [], "intervinientes": ["Ángela Vivanco", "Carmen Gloria Wittwer (fiscal regional de Los Lagos)", "Gonzalo Migueles", "Eduardo Lagos Herrera", "Mario Vargas", "Belaz Movitec", "Codelco", "OS7 de Carabineros"], "pers": ["belaz movitec", "carmen gloria wittwer", "codelco", "eduardo lagos herrera", "gonzalo migueles", "mario vargas", "os7 de carabineros", "ángela vivanco"], "fuentes": [{"titulo": "Vivanco romperá su silencio ante Fiscalía: declarará en agosto por caso Muñeca Bielorrusa", "url": "https://www.elmo const TOP = 34;

// Geometria del lienzo. En celular la tarjeta se angosta, los carriles se
// aprietan y el hueco de la izquierda se achica con las etiquetas, asi que
// nada de esto puede ser constante: lo fija medir() segun la pantalla real.
let CARD_W = 216, STEP = CARD_W + 30, X0 = 200 + CARD_W / 2;

// Alto de carril y de miniatura: se ajustan al alto de pantalla para que los
// 7 carriles quepan sin scroll vertical en la mayoria de los proyectores.
let LANE_H = 108, THUMB_H = 38;

const MQ_MOVIL = window.matchMedia('(max-width: 820px)');
let movil = MQ_MOVIL.matches;

let paso = -1;          // ultimo indice revelado
let seleccion = -1;     // hito que se esta mirando (-1 = el ultimo revelado)
let auto = null;
let tirando = false;    // arrastrando la barra de avance

/* Personas resaltadas: nombre normalizado -> etiqueta visible. Al activar una,
   se hilan con punteada todos los hitos revelados donde aparece. */
const personas = new Map();
const PALETA = ['#F4A261', '#7CD992', '#5AC8FA', '#FF7AB6', '#C9A0FF', '#FFD166'];
const colorDe = p => PALETA[[...personas.keys()].indexOf(p) % PALETA.length];

let pasoGuardado = null;   // avance del relato mientras dura el filtro

function aplicarFiltro() {
  if (personas.size) {
    // Al filtrar se muestran todos los hitos de esa persona de una vez: la
    // gracia es revisarlos juntos, no volver a avanzarlos de a uno.
    if (pasoGuardado === null) pasoGuardado = paso;
    paso = visibles().length - 1;
  } else if (pasoGuardado !== null) {
    paso = pasoGuardado;
    pasoGuardado = null;
  }
  seleccion = -1;
  pararAuto();
  pintarCarriles();
  redibujar(false);
  $('scroll').scrollTo({ left: 0 });
}

function alternarPersona(clave, etiqueta) {
  if (personas.has(clave)) personas.delete(clave);
  else if (personas.size < PALETA.length) personas.set(clave, etiqueta);
  aplicarFiltro();
}
function limpiarPersonas() { personas.clear(); aplicarFiltro(); }

const $ = id => document.getElementById(id);

// Con personas resaltadas el diagrama se reduce a los hitos donde aparecen, y
// se juntan: dejarlos en su sitio con el resto atenuado obligaba a barrer todo
// el ancho para encontrarlos.
const visibles = () => personas.size
  ? NODOS.filter(n => n.pers.some(p => personas.has(p)))
  : NODOS;

function medir() {
  movil = MQ_MOVIL.matches;
  const angosto = window.innerWidth <= 380;

  // Una tarjeta de 216 px en una pantalla de 360 ocupa el ancho entero: no se
  // alcanza a ver que hay un hito antes y otro despues, que es justo lo que el
  // diagrama tiene que mostrar.
  CARD_W = movil ? (angosto ? 132 : 146) : 216;
  STEP   = CARD_W + (movil ? 16 : 30);
  // Hueco de la izquierda: tan ancho como las etiquetas de carril, para que el
  // primer hito no nazca debajo de su rotulo.
  X0 = (movil ? (angosto ? 88 : 108) : 200) + CARD_W / 2;

  // El alto disponible es el del lienzo, no el de la ventana. En celular el
  // header envuelve a dos lineas y abajo va la barra de navegacion: restar
  // solo el header daba de mas y los ultimos carriles caian fuera de pantalla.
  const lienzo = document.querySelector('.lienzo');
  const alto = lienzo.clientHeight
    || (window.innerHeight - document.querySelector('header').offsetHeight);
  const disp = alto - TOP - 26;

  // Si ni al minimo caben los 7 carriles, el lienzo hace scroll vertical: es
  // preferible a encogerlos hasta que la tarjeta no se lea.
  LANE_H  = Math.max(movil ? 58 : 76, Math.min(122, Math.floor(disp / ORDEN.length)));
  THUMB_H = LANE_H >= 104 ? 38 : LANE_H >= 90 ? 30 : 0;   // 0 = sin foto
  const r = document.documentElement.style;
  r.setProperty('--lane-h', LANE_H + 'px');
  r.setProperty('--thumb-h', THUMB_H + 'px');
  r.setProperty('--card-w', CARD_W + 'px');
}

function laneY(arista) {
  return TOP + ORDEN.indexOf(arista) * LANE_H + LANE_H / 2;
}
function posX(pos) { return X0 + pos * STEP; }

/* ── Ajuste del titulo a la tarjeta ─────────────────────────────────
   Los titulos van de 44 a 127 caracteres, asi que un tamano fijo o los corta o
   desperdicia la tarjeta. Se estima cuantas lineas ocupa cada uno y se baja la
   letra hasta que entre entero. Es una estimacion por ancho medio de caracter
   en vez de medir el DOM: medir 112 tarjetas en cada paso provoca un reflow por
   tarjeta y la navegacion se siente pegajosa. */
const EM_CHAR = 0.53;          // ancho medio de caracter, en fracciones de em
const FS_MAX = 11.5, FS_MIN = 9;
const LH = 1.25;

function cajaTitulo(conFoto) {
  return {
    w: CARD_W - 14,                                            // padding lateral
    h: LANE_H - 4 - (conFoto ? THUMB_H : 0) - 14 - 10 - 4      // franja, foto, fecha, padding
  };
}

function lineasQueOcupa(texto, fs, w) {
  const porLinea = Math.max(6, Math.floor(w / (fs * EM_CHAR)));
  // Las palabras no se parten, asi que las lineas quedan irregulares: 6% de
  // holgura evita que un titulo se desborde por un salto desafortunado.
  return Math.ceil(texto.length / porLinea * 1.06);
}

function entra(texto, fs, conFoto) {
  const c = cajaTitulo(conFoto);
  return lineasQueOcupa(texto, fs, c.w) * fs * LH <= c.h;
}

function ajustarTitulo(texto, conFoto) {
  for (let fs = FS_MAX; fs > FS_MIN; fs -= 0.5) {
    if (entra(texto, fs, conFoto)) return fs;
  }
  return FS_MIN;
}

// Si ni al minimo entra el titulo completo, se usa el rotulo corto: preferible
// a dejarlo cortado con puntos suspensivos.
function tituloDeTarjeta(n, conFoto) {
  return entra(n.titulo, FS_MIN, conFoto) ? n.titulo : n.corto;
}

// Mismo criterio que norm() en Python: 'Ángela Vivanco (exministra)' -> 'ángela
// vivanco', para que la misma persona escrita distinto sea la misma persona.
function normJS(nombre) {
  return String(nombre).split('(')[0].trim().toLowerCase().split(/\s+/).join(' ');
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ── Construccion inicial ───────────────────────────────────────── */
function pintarEtiquetas() {
  $('etiquetas').innerHTML = ORDEN.map(a =>
    `<div class="etiqueta" data-a="${a}" style="color:${ARISTAS[a].color}">
       <i></i>${ARISTAS[a].label}
     </div>`).join('');
}

function pintarCarriles() {
  const pista = $('pista');
  pista.querySelectorAll('.carril,.anio-marca,.anio-linea').forEach(e => e.remove());
  ORDEN.forEach((a, i) => {
    const d = document.createElement('div');
    d.className = 'carril';
    d.dataset.a = a;
    d.style.top = (TOP + i * LANE_H) + 'px';
    d.style.color = ARISTAS[a].color;
    pista.appendChild(d);
  });

  const lista = visibles();
  pista.style.width = (posX(lista.length) + 260) + 'px';
  pista.style.height = (TOP + ORDEN.length * LANE_H + 24) + 'px';

  let anioPrev = null;
  lista.forEach((n, pos) => {
    if (n.anio === anioPrev) return;
    anioPrev = n.anio;
    const x = posX(pos) - STEP / 2;
    const m = document.createElement('div');
    m.className = 'anio-marca';
    m.style.left = x + 'px';
    m.textContent = n.anio;
    pista.appendChild(m);
    const l = document.createElement('div');
    l.className = 'anio-linea';
    l.style.left = x + 'px';
    pista.appendChild(l);
  });
}

/* ── Dibujo incremental ─────────────────────────────────────────── */
function redibujar(scrollTo) {
  const pista = $('pista'), svg = $('svg');
  pista.querySelectorAll('.nodo,.cruce-marca').forEach(e => e.remove());
  svg.innerHTML = '';

  const lista = visibles();
  const hasta = Math.min(paso, lista.length - 1);
  // 'hasta' es hasta donde se revelo el diagrama; 'mirando' es el hito que se
  // esta leyendo en el panel. Son distintos para poder volver a revisar un
  // hecho anterior sin borrar lo que ya se conto.
  const mirando = Math.min(seleccion < 0 ? hasta : seleccion, hasta);
  const ultimoPorArista = {};
  const posDe = {};
  lista.forEach((n, i) => posDe[n.idx] = i);

  const ns = 'http://www.w3.org/2000/svg';
  const linea = (x1, y1, x2, y2, color, w, dash, op) => {
    const p = document.createElementNS(ns, 'path');
    const mx = (x1 + x2) / 2;
    p.setAttribute('d', y1 === y2
      ? `M${x1},${y1} L${x2},${y2}`
      : `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    p.setAttribute('stroke', color);
    p.setAttribute('stroke-width', w);
    p.setAttribute('fill', 'none');
    p.setAttribute('opacity', op);
    if (dash) p.setAttribute('stroke-dasharray', dash);
    svg.appendChild(p);
  };

  for (let i = 0; i <= hasta; i++) {
    const n = lista[i];
    const x = posX(i), y = laneY(n.principal);
    const color = ARISTAS[n.principal].color;
    const esActual   = i === mirando;
    const esFrontera = i === hasta && hasta !== mirando;

    // Hilo del propio carril
    const ant = ultimoPorArista[n.principal];
    if (ant !== undefined) {
      linea(posX(ant), y, x, y, color, 2.2, null, 0.5);
    }

    // Cruces explicitos: el hecho pertenece a otra arista tambien
    n.cruces.forEach(a => {
      const y2 = laneY(a);
      linea(x, y, x, y2, ARISTAS[a].color, 2, '4 3', esActual ? 0.9 : 0.5);
      // Marquita en el punto donde la vertical toca el otro carril: senala el
      // cruce sin parecer un hito aparte. El hecho se dibuja una sola vez.
      const c = document.createElement('div');
      c.className = 'cruce-marca';
      c.style.left = x + 'px';
      c.style.top = y2 + 'px';
      c.style.background = ARISTAS[a].color;
      pista.appendChild(c);
      if (ultimoPorArista[a] === undefined) ultimoPorArista[a] = i;
    });

    // Cruces por interviniente compartido
    n.enlaces.forEach(e => {
      const p = posDe[e.idx];
      if (p === undefined || p > hasta) return;
      // Con tarjetas grandes estas lineas ensucian mucho: solo se destacan las
      // del hecho actual, el resto queda como rastro tenue.
      linea(posX(p), laneY(e.de), x, y, esActual ? '#8B97AB' : '#5A6474',
            esActual ? 1.6 : 1, '2 5', esActual ? 0.9 : 0.13);
    });

    const suyas = [...personas.keys()].filter(p => n.pers.includes(p));
    const d = document.createElement('div');
    // 'clave' ya no cambia como se ve la tarjeta, pero se sigue emitiendo
    // porque el dato viaja en NODOS y lo usan las correcciones.
    d.className = 'nodo' + (n.clave ? ' clave' : '')
                + (n.abre.length ? ' abre' : '')
                + (esActual ? ' actual' : '') + (esFrontera ? ' frontera' : '')
                + (suyas.length ? ' resalta' : '');
    if (n.abre.length) d.style.setProperty('--a', ARISTAS[n.abre[0]].color);
    if (suyas.length) d.style.setProperty('--p', colorDe(suyas[0]));
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    d.style.setProperty('--c', color);
    d.title = n.fecha + ' — ' + n.titulo;

    const foto = (n.imagen && THUMB_H > 0)
      ? `<img src="${esc(n.imagen)}" alt="" loading="lazy"
              referrerpolicy="no-referrer" onerror="this.remove()">` : '';
    const nueva = n.abre.length
      ? `<span class="t-nueva">Abre ${esc(ARISTAS[n.abre[0]].label)}</span>` : '';

    // Franja: el carril propio primero, despues las otras aristas del hecho.
    const franja = [n.principal].concat(n.cruces)
      .map(a => `<i style="background:${ARISTAS[a].color}"></i>`).join('');

    const conFoto = foto !== '';
    const texto = tituloDeTarjeta(n, conFoto);
    d.innerHTML = `<div class="tarjeta">
        <div class="t-franja">${franja}</div>
        ${foto}${nueva}
        <div class="t-cab"><i></i><b>${n.n}</b>${esc(n.fecha)}</div>
        <div class="t-tit" style="font-size:${ajustarTitulo(texto, conFoto)}px">${esc(texto)}</div>
      </div>`;
    // Clic = mirar ese hito, no retroceder. El avance queda donde estaba.
    // En celular el detalle no esta a la vista, asi que tocar el hito ademas
    // sube la hoja: si no, el toque no parece hacer nada.
    d.onclick = () => { seleccion = i; redibujar(false); abrirHoja(); };
    pista.appendChild(d);

    ultimoPorArista[n.principal] = i;
  }

  // Hilo de cada persona resaltada: une en orden los hitos ya revelados donde
  // aparece. Se dibuja al final para que quede por encima del resto.
  personas.forEach((etiqueta, p) => {
    const col = colorDe(p);
    const pts = [];
    for (let i = 0; i <= hasta; i++) if (lista[i].pers.includes(p)) pts.push(i);
    for (let k = 0; k < pts.length - 1; k++) {
      const a = lista[pts[k]], b = lista[pts[k + 1]];
      linea(posX(pts[k]), laneY(a.principal), posX(pts[k + 1]), laneY(b.principal),
            col, 1.8, '3 4', 0.9);
    }
  });

  $('personas').innerHTML = personas.size
    ? [...personas].map(([p, et]) =>
        `<span class="persona-chip" style="background:${colorDe(p)}">${esc(et)}
           <button onclick="alternarPersona('${esc(p).replace(/'/g, "\\'")}')">✕</button>
         </span>`).join('') +
      (personas.size > 1 ? `<button onclick="limpiarPersonas()">Limpiar</button>` : '')
    : '';

  // Carriles y etiquetas de las aristas ya abiertas: los demas ni se dibujan.
  const abiertas = new Set();
  for (let i = 0; i <= hasta; i++) lista[i].aristas.forEach(a => abiertas.add(a));
  document.querySelectorAll('.etiqueta').forEach(el =>
    el.classList.toggle('viva', abiertas.has(el.dataset.a)));
  pista.querySelectorAll('.carril').forEach(el =>
    el.classList.toggle('abierta', abiertas.has(el.dataset.a)));

  $('n-hito').textContent = mirando >= 0 ? lista[mirando].n : '—';
  $('n-actual').textContent = hasta + 1 < 0 ? 0 : hasta + 1;
  $('n-total').textContent = lista.length;
  const pct = lista.length ? (hasta + 1) / lista.length * 100 : 0;
  $('barra').style.width = pct + '%';
  barra.style.setProperty('--pos', pct + '%');
  $('btn-atras').disabled = hasta < 0;
  $('btn-sig').disabled = hasta >= lista.length - 1;
  $('m-atras').disabled = hasta < 0;
  $('m-sig').disabled = hasta >= lista.length - 1;
  $('m-detalle').disabled = mirando < 0;
  sincHoja();

  panel(mirando >= 0 ? lista[mirando] : null, lista, posDe, mirando !== hasta);

  if (scrollTo && mirando >= 0) {
    const s = $('scroll');
    s.scrollTo({ left: posX(mirando) - s.clientWidth * 0.62, behavior: 'smooth' });
  }
}

/* ── Panel de detalle ───────────────────────────────────────────── */
function panel(n, lista, posDe, revisando) {
  const el = $('panel');
  if (!n) {
    el.innerHTML = `<div class="vacio">
      Pulsa <b>Siguiente</b> (o la flecha →) para ir levantando el caso hecho por hecho.<br><br>
      Cada carril es una arista, y aparece cuando entra el hito que la abre.
      Cuando un hecho pertenece a dos aristas, se dibuja la línea vertical que
      las cruza. Las líneas punteadas grises marcan de dónde sale un hecho.
    </div>`;
    return;
  }

  const abre = n.abre.map(a =>
    `<div class="aviso abre">Se abre una arista nueva:
       <b style="color:${ARISTAS[a].color}">${ARISTAS[a].label}</b></div>`).join('');

  const cruces = n.cruces.length ? `<div class="aviso">
      Este hecho <b>cruza</b> ${ARISTAS[n.principal].label} con
      ${n.cruces.map(a => `<b style="color:${ARISTAS[a].color}">${ARISTAS[a].label}</b>`).join(' y ')}:
      pertenece a las dos a la vez.</div>` : '';

  const enlaces = n.enlaces.filter(e => posDe[e.idx] !== undefined).map(e => {
    const prev = NODOS[e.idx];
    return `<div class="aviso">Se conecta con
      <b>${prev.fecha}</b> (${ARISTAS[e.de].label}) a través de
      <b>${e.via.join(', ')}</b>.</div>`;
  }).join('');

  const volver = revisando ? `<div class="revisando">
      Estás revisando un hito anterior. El avance sigue más adelante.
      <button onclick="volverAlAvance()">Volver al punto actual</button>
    </div>` : '';

  el.innerHTML = `
    ${volver}
    <div class="p-fecha">Hito ${n.n} · ${n.fecha}</div>
    <div class="p-titulo">${n.titulo}</div>
    ${n.imagen ? `<img class="p-img" src="${n.imagen}" alt="" loading="lazy"
        referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
    ${abre}${cruces}${enlaces}
    <div class="p-desc">${n.desc}</div>
    <div class="p-bloque">
      <h3>Aristas</h3>
      ${n.aristas.map(a => `<span class="pill" style="background:${ARISTAS[a].color}">${ARISTAS[a].label}</span>`).join('')}
    </div>
    <div class="p-bloque">
      <h3>Intervinientes</h3>
      ${n.intervinientes.map((nom, k) => {
          const p = n.pers.find(x => x === normJS(nom)) || normJS(nom);
          const on = personas.has(p);
          return `<button class="tag${on ? ' activo' : ''}"
            ${on ? `style="--p:${colorDe(p)}"` : ''}
            title="Resaltar todos los hitos con esta persona"
            onclick="alternarPersona('${esc(p).replace(/'/g, "\\'")}', '${esc(nom).replace(/'/g, "\\'")}')"
            >${esc(nom)}</button>`;
        }).join('')}
    </div>
    <div class="p-bloque">
      <h3>Fuentes</h3>
      ${n.fuentes.map(f => `<a class="p-fuente" href="${f.url}" target="_blank" rel="noopener">
          ${f.titulo}<br><span style="opacity:.65">${f.medio}</span></a>`).join('')}
    </div>`;
}

/* ── Controles ──────────────────────────────────────────────────── */
// Avanzar y retroceder mueven el relato y sueltan la revision: si estabas
// mirando un hito viejo, la flecha te devuelve al hilo en vez de saltar.
function sig()   { const l = visibles(); if (paso < l.length - 1) { paso++; seleccion = -1; redibujar(true); } else pararAuto(); }
function atras() { if (paso >= 0) { paso--; seleccion = -1; redibujar(true); } }
function reinicio() {
  paso = -1; seleccion = -1; pasoGuardado = null;
  pararAuto(); redibujar(false);
  $('scroll').scrollTo({left: 0, behavior: 'smooth'});
}
function volverAlAvance() { seleccion = -1; redibujar(true); }

function pararAuto() {
  if (auto) { clearInterval(auto); auto = null; $('btn-auto').textContent = '▶ Auto'; $('btn-auto').classList.remove('activo'); }
}
function alternarAuto() {
  if (auto) return pararAuto();
  auto = setInterval(sig, 2600);
  $('btn-auto').textContent = '⏸ Pausa';
  $('btn-auto').classList.add('activo');
  sig();
}

$('btn-sig').onclick = () => { pararAuto(); sig(); };
$('btn-atras').onclick = () => { pararAuto(); atras(); };
$('btn-reinicio').onclick = reinicio;
$('btn-auto').onclick = alternarAuto;
$('btn-full').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};
/* ── Celular: hoja de detalle y barra de navegacion ─────────────── */
// La hoja solo existe en celular; en escritorio el panel esta siempre a la
// vista y estas funciones no hacen nada.
function abrirHoja()  { if (movil) { document.body.classList.add('hoja'); sincHoja(); } }
function cerrarHoja() { document.body.classList.remove('hoja'); sincHoja(); }
function sincHoja() {
  const b = $('m-detalle');
  if (b) b.textContent = document.body.classList.contains('hoja') ? 'Cerrar' : 'Detalle';
}

$('tapa').onclick = cerrarHoja;
$('m-detalle').onclick = () =>
  document.body.classList.contains('hoja') ? cerrarHoja() : abrirHoja();
// Avanzar con la hoja abierta taparia el hito que acaba de entrar.
$('m-sig').onclick      = () => { pararAuto(); cerrarHoja(); sig(); };
$('m-atras').onclick    = () => { pararAuto(); cerrarHoja(); atras(); };
$('m-reinicio').onclick = () => { cerrarHoja(); reinicio(); };

/* ── Barra de avance: pinchar o arrastrar para saltar ───────────── */
const barra = document.querySelector('.barra');

function pasoDesde(e) {
  const r = barra.getBoundingClientRect();
  const cx = e.touches && e.touches.length ? e.touches[0].clientX : e.clientX;
  const f = Math.min(1, Math.max(0, (cx - r.left) / r.width));
  const total = visibles().length;
  const nuevo = Math.min(total - 1, Math.max(-1, Math.round(f * total) - 1));
  if (nuevo === paso) return;      // sin esto se redibuja en cada pixel
  paso = nuevo;
  seleccion = -1;
  redibujar(true);
}

barra.addEventListener('mousedown', e => {
  e.preventDefault();
  pararAuto();
  tirando = true;
  barra.classList.add('tirando');
  pasoDesde(e);
});
window.addEventListener('mousemove', e => { if (tirando) pasoDesde(e); });
window.addEventListener('mouseup', () => {
  if (!tirando) return;
  tirando = false;
  barra.classList.remove('tirando');
});

// Lo mismo con el dedo. passive:false porque hay que impedir que el gesto se
// lo lleve el scroll de la pagina mientras se arrastra la barra.
barra.addEventListener('touchstart', e => {
  pararAuto();
  tirando = true;
  barra.classList.add('tirando');
  pasoDesde(e);
}, { passive: true });
barra.addEventListener('touchmove', e => {
  if (!tirando) return;
  e.preventDefault();
  pasoDesde(e);
}, { passive: false });
barra.addEventListener('touchend', () => {
  tirando = false;
  barra.classList.remove('tirando');
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'A') return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pararAuto(); sig(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); pararAuto(); atras(); }
  else if (e.key === 'Home') { e.preventDefault(); reinicio(); }
  else if (e.key.toLowerCase() === 'f') $('btn-full').click();
  else if (e.key.toLowerCase() === 'p') alternarAuto();
});

document.addEventListener('fullscreenchange', () =>
  document.body.classList.toggle('presenta', !!document.fullscreenElement));

let reajuste = null;
window.addEventListener('resize', () => {
  clearTimeout(reajuste);
  reajuste = setTimeout(() => {
    medir();
    // Al girar el telefono o al pasar a escritorio la hoja queda flotando sobre
    // un panel que ya es columna: se cierra y el detalle vuelve a su sitio.
    if (!movil) cerrarHoja();
    pintarCarriles();
    redibujar(false);
  }, 150);
});

medir();
pintarEtiquetas();
pintarCarriles();
redibujar(false);
</script>
</body>
